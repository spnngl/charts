# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: Renovate

on:
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.138.0@sha256:32027ed5e5e450f76ee372fcd6e72c8114db7fdb28c97c520515a03ea4a0d77b
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No file argument on purpose: with one, the validator checks the file as a
      # *global* config; without, it discovers renovate.json as a repository
      # config.
      - name: renovate-config-validator --strict
        run: renovate-config-validator --strict
