name: Renovate

on:
  pull_request:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml
  push:
    branches:
      - main
    paths:
      - renovate.json
      - .github/workflows/renovate.yml

permissions:
  contents: read

jobs:
  validate:
    name: Validate Renovate config
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.135.0@sha256:cada8681f79e153506daf4e89e5fc405efb281a7d8f9d9fc5e3eb54d5b74bc85
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No file argument on purpose: with one, the validator checks the file as a
      # *global* config; without, it discovers renovate.json as a repository
      # config.
      - name: renovate-config-validator --strict
        run: renovate-config-validator --strict
