name: Release

on:
  push:
    branches: [main]
    paths:
      - "charts/**"
      - ".github/workflows/release.yml"
      - "tooling/release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  OCI_PATH: ghcr.io/spnngl/charts

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          tools: nushell
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          matrix="$(nu tooling/release/plan.nu)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [[ "$matrix" == "[]" ]]; then echo "any=false" >> "$GITHUB_OUTPUT"; else echo "any=true" >> "$GITHUB_OUTPUT"; fi

  publish:
    name: Publish ${{ matrix.chart.name }} ${{ matrix.chart.version }}
    needs: [plan]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # GitHub Release
      packages: write        # GHCR push
      id-token: write        # Sigstore (GitHub attestations)
      attestations: write    # GitHub attestations store
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        chart: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          tools: nushell helm cosign oras syft

      - name: Registry login
        # helm uses its own credential store (~/.config/helm/registry); cosign and the
        # GitHub attestation actions read ~/.docker/config.json. Both are needed.
        run: |
          echo "${{ github.token }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ github.token }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Package
        id: package
        run: |
          set -euo pipefail
          helm package "${{ matrix.chart.dir }}" -d dist
          echo "tgz=dist/${{ matrix.chart.name }}-${{ matrix.chart.version }}.tgz" >> "$GITHUB_OUTPUT"

      - name: Push (or resume from the existing tag)
        id: push
        run: |
          set -euo pipefail
          tag_ref="$OCI_PATH/${{ matrix.chart.name }}:${{ matrix.chart.version }}"
          if digest="$(oras resolve "$tag_ref" 2>/dev/null)"; then
            # A previous run pushed this version but failed later: never overwrite a
            # published tag, resume signing/attesting/releasing from its digest.
            echo "::notice::$tag_ref already exists ($digest); resuming"
            # SBOM and release asset must describe the bytes actually in the registry.
            rm -f "${{ steps.package.outputs.tgz }}"
            helm pull "oci://$OCI_PATH/${{ matrix.chart.name }}" --version "${{ matrix.chart.version }}" -d dist
          else
            out="$(helm push "${{ steps.package.outputs.tgz }}" "oci://$OCI_PATH" 2>&1 | tee /dev/stderr)"
            digest="$(sed -n 's/^Digest: //p' <<<"$out")"
          fi
          [[ "$digest" == sha256:* ]] || { echo "::error::could not determine chart digest"; exit 1; }
          {
            echo "digest=$digest"
            echo "ref=$OCI_PATH/${{ matrix.chart.name }}@$digest"
          } >> "$GITHUB_OUTPUT"

      - name: Sign (cosign, key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign sign --yes --key env://COSIGN_PRIVATE_KEY "${{ steps.push.outputs.ref }}"

      - name: SBOM (syft)
        run: syft scan "file:${{ steps.package.outputs.tgz }}" -o spdx-json=dist/sbom.spdx.json

      - name: Attest SBOM (cosign, key)
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type spdxjson --predicate dist/sbom.spdx.json "${{ steps.push.outputs.ref }}"

      - name: Attest provenance (GitHub)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.OCI_PATH }}/${{ matrix.chart.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Attest SBOM (GitHub)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.OCI_PATH }}/${{ matrix.chart.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: dist/sbom.spdx.json
          push-to-registry: true

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ matrix.chart.name }}-${{ matrix.chart.version }}"
          notes="$(nu -c 'open "${{ matrix.chart.dir }}/Chart.yaml" | get annotations."artifacthub.io/changes" | from yaml | each {|c| $"- ($c)" } | str join "\n"')"
          cat > notes.md <<EOF
          ## ${{ matrix.chart.name }} ${{ matrix.chart.version }}

          $notes

          \`\`\`sh
          helm install ${{ matrix.chart.name }} oci://$OCI_PATH/${{ matrix.chart.name }} --version ${{ matrix.chart.version }}
          \`\`\`

          Digest: \`${{ steps.push.outputs.digest }}\` — verify with \`cosign verify --key cosign.pub\` and \`gh attestation verify --owner ${{ github.repository_owner }}\`.
          EOF
          gh release create "$tag" "${{ steps.package.outputs.tgz }}" dist/sbom.spdx.json \
            --title "$tag" --notes-file notes.md --target "$GITHUB_SHA"

      - name: Package visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="charts%2F${{ matrix.chart.name }}"
          vis="$(gh api "/users/${{ github.repository_owner }}/packages/container/$pkg" -q .visibility 2>/dev/null || echo unknown)"
          echo "GHCR package visibility: $vis"
          if [[ "$vis" != "public" ]]; then
            echo "::warning::GHCR package charts/${{ matrix.chart.name }} is '$vis'. Make it public once: https://github.com/users/${{ github.repository_owner }}/packages/container/$pkg/settings"
          fi

  artifacthub:
    # Runs for every published chart on every release run (idempotent), so
    # charts published before the Artifact Hub secrets existed get registered too.
    name: Artifact Hub
    needs: [plan, publish]
    if: always() && needs.plan.result == 'success' && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # push the artifacthub.io metadata tag
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          tools: nushell oras
      - name: Registry login
        run: echo "${{ github.token }}" | oras login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Register repositories and push metadata
        env:
          AH_API_KEY_ID: ${{ secrets.AH_API_KEY_ID }}
          AH_API_KEY_SECRET: ${{ secrets.AH_API_KEY_SECRET }}
        run: nu tooling/release/artifacthub.nu --all

  verify:
    name: Verify ${{ matrix.chart.name }} ${{ matrix.chart.version }}
    needs: [plan, publish]
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-tools
        with:
          tools: nushell helm cosign
      - name: Registry login (read; package may still be private on first publish)
        run: |
          echo "${{ github.token }}" | helm registry login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
          echo "${{ github.token }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
      - name: Smoke test with the documented verify commands
        env:
          GH_TOKEN: ${{ github.token }}
        run: nu tooling/release/verify.nu "${{ matrix.chart.name }}" "${{ matrix.chart.version }}"
