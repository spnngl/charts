# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/refs/heads/master/src/schemas/json/github-workflow.json

name: Conventional Commits

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    permissions:
      contents: read
      pull-requests: read
    # The default commit types are the commit conventions in AGENTS.md /
    # CONTRIBUTING.md.
    uses: spnngl/.github/.github/workflows/conventional-commits.yml@main
