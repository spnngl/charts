# Pinned tool versions. Single source of truth for CI (.github/actions/setup-tools)
# and local runs. Renovate updates these lines (see renovate.json5).

[tools]
# renovate: datasource=github-releases depName=nushell/nushell
nushell = "0.116.1"
# renovate: datasource=github-releases depName=helm/helm
helm = "3.22.0"
# Helm 4 (server-side apply by default): pr.yml install tests only.
# renovate: datasource=github-releases depName=helm/helm
helm4 = "4.3.0"
# renovate: datasource=github-releases depName=kubernetes-sigs/kustomize extractVersion=^kustomize/v(?<version>.*)$
kustomize = "5.8.3"
# renovate: datasource=github-releases depName=yannh/kubeconform
kubeconform = "0.8.0"
# Kubernetes version whose OpenAPI-derived JSON schemas validate rendered CRDs (kubeconform).
# Tracks Kubernetes releases. The schemas are read from the `master` branch of
# yannh/kubernetes-json-schema, which has no such release tags: when it lags
# behind, the Renovate PR stays red until it catches up.
# renovate: datasource=github-releases depName=kubernetes/kubernetes
k8s-json-schema = "1.37.1"
# renovate: datasource=github-releases depName=helm/chart-testing
chart-testing = "3.15.0"
# renovate: datasource=github-releases depName=sigstore/cosign
cosign = "3.1.3"
# renovate: datasource=github-releases depName=oras-project/oras
oras = "1.3.4"
# renovate: datasource=github-releases depName=anchore/syft
syft = "1.54.1"
# renovate: datasource=github-releases depName=stackrox/kube-linter
kube-linter = "0.8.3"
# renovate: datasource=github-releases depName=norwoodj/helm-docs
helm-docs = "1.14.2"
# renovate: datasource=github-releases depName=dadav/helm-schema
helm-schema = "0.23.5"
# renovate: datasource=github-releases depName=kubernetes-sigs/kind
kind = "0.33.0"
