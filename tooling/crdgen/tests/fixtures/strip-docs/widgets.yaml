apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: widgets.example.io
spec:
  group: example.io
  names:
    kind: Widget
    plural: widgets
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Ready
          type: string
          jsonPath: .status.ready
          description: Readiness.
      schema:
        openAPIV3Schema:
          description: Widget is a thing.
          title: Widget
          type: object
          properties:
            spec:
              description: Spec.
              type: object
              default:
                description: data, not documentation
              properties:
                description:
                  description: A field that happens to be named description.
                  type: string
                  example: hello
                tags:
                  type: array
                  items:
                    description: One tag.
                    type: string
                labels:
                  type: object
                  additionalProperties:
                    description: One label value.
                    type: string
                choice:
                  allOf:
                    - description: First branch.
                      type: string
                  externalDocs:
                    url: https://example.io
                open:
                  type: object
                  additionalProperties: true
