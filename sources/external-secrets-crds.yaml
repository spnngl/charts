name: external-secrets-crds
description: CustomResourceDefinitions for External Secrets Operator (stores, external/push secrets, generators)
upstream:
  repo: https://github.com/external-secrets/external-secrets
  homepage: https://external-secrets.io
  icon: https://raw.githubusercontent.com/external-secrets/external-secrets/main/assets/eso-icon.svg
  license: Apache-2.0
version:
  tagPattern: '^v(\d+\.\d+\.\d+)$'
  allow: all
  current: v2.12.0
sources:
  # controller-gen output; deploy/crds/bundle.yaml is derived from it. The
  # release asset external-secrets.yaml is a mixed-kind install manifest: avoided.
  - kind: git-path
    path: config/crds/bases
transform:
  include: []
  exclude: []
  patches: []
