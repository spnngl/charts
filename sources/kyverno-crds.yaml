name: kyverno-crds
description: CustomResourceDefinitions for Kyverno (kyverno.io policies, exceptions, reports, wgpolicyk8s.io policy reports)
upstream:
  repo: https://github.com/kyverno/kyverno
  homepage: https://kyverno.io
  icon: https://raw.githubusercontent.com/kyverno/kyverno/main/img/logo.png
  license: Apache-2.0
version:
  # Repo also carries `kyverno-policies-chart-v*` and `test-dev` tags;
  # pre-releases (-rc, -beta) are excluded by the pattern.
  tagPattern: '^v(\d+\.\d+\.\d+)$'
  allow: all
  current: v1.19.1
sources:
  # controller-gen output (Makefile CRDS_PATH): kyverno.io, reports.kyverno.io,
  # wgpolicyk8s.io; same set as the in-tree chart's `crds` subchart.
  - kind: git-path
    path: config/crds
transform:
  include: []
  # policies.kyverno.io ships in kyverno-api-crds, mirroring upstream's
  # `kyverno-api` subchart; together they exceed Helm's 1 MiB release Secret.
  exclude: ['\.policies\.kyverno\.io$']
  patches: []
