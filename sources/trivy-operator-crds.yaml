# yaml-language-server: $schema=./schema.json
name: trivy-operator-crds
description: CustomResourceDefinitions for Trivy Operator (VulnerabilityReport, ConfigAuditReport, SbomReport and other security reports)
upstream:
  repo: https://github.com/aquasecurity/trivy-operator
  homepage: https://aquasecurity.github.io/trivy-operator/latest
  icon: https://raw.githubusercontent.com/aquasecurity/trivy-operator/main/docs/images/trivy-operator-logo.png
  license: Apache-2.0
version:
  # Repo also carries `-rc*` pre-release tags; this pattern excludes them.
  tagPattern: '^v(\d+\.\d+\.\d+)$'
  allow: all
  current: v0.35.0
sources:
  # Only CRD location upstream: controller-gen writes here directly (plain YAML,
  # no templating); deploy/static/trivy-operator.yaml is a bundle built from it.
  - kind: git-path
    path: deploy/helm/crds
transform:
  include: []
  exclude: []
  patches: []
