name: kyverno-api-crds
description: CustomResourceDefinitions for Kyverno CEL policies (policies.kyverno.io)
upstream:
  repo: https://github.com/kyverno/kyverno
  homepage: https://kyverno.io
  icon: https://raw.githubusercontent.com/kyverno/kyverno/main/img/logo.png
  license: Apache-2.0
version:
  # Repo also carries `kyverno-policies-chart-v*` and `test-dev` tags;
  # pre-releases (-rc, -beta) are excluded by the pattern.
  tagPattern: '^v(\d+\.\d+\.\d+)$'
  allow: all
  current: v1.19.1
sources:
  # Generated from github.com/kyverno/api and vendored per Kyverno release.
  # Upstream ships them as the `kyverno-api` subchart, whose own repo only
  # has pre-release tags; tracking the Kyverno tag keeps both charts aligned.
  - kind: git-path
    path: config/crds/policies.kyverno.io
transform:
  include: []
  exclude: []
  patches: []
