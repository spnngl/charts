values:
  secrets:
    pop3Auth:
      name: pop3-htpasswd
  metrics:
    enabled: true
  networkPolicy:
    http:
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
    smtp:
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: apps
        podSelector:
          matchLabels:
            app: sender
    pop3:
      from:
      - ipBlock:
          cidr: 10.0.0.0/8
    metrics:
      from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
