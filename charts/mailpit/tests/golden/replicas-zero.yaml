    helm.sh/chart: mailpit-0.0.0
  name: mailpit
  namespace: mailpit
spec:
  ingress:
    - ports:
      - port: 8025
        protocol: TCP
    - ports:
      - port: 1025
        protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mailpit
      app.kubernetes.io/name: mailpit
  policyTypes:
    - Ingress
