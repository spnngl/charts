apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: mailpit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mail
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: mailpit-0.0.0
  name: mailpit
  namespace: mailpit
spec:
  egress:
    - ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
      - port: 587
        protocol: TCP
      to:
      - ipBlock:
          cidr: 10.0.0.0/8
  ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: ingress-nginx
      ports:
      - port: 8025
        protocol: TCP
    - ports:
      - port: 1025
        protocol: TCP
    - ports:
      - port: 1110
        protocol: TCP
    - ports:
      - port: 9090
        protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: mailpit
      app.kubernetes.io/name: mail
  policyTypes:
    - Ingress
    - Egress
