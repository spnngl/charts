# Source: mailpit/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: mailpit
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: mail
    app.kubernetes.io/version: 0.0.0
    helm.sh/chart: mailpit-0.0.0
  name: mailpit
  namespace: mailpit
spec:
  groups:
    - name: mailpit
      rules:
        - alert: MailpitDown
          annotations:
            description: "mailpit/mailpit has been down or absent from the scrape targets for 5m: the pod is crashing, not running, or scaled to 0."
            summary: Mailpit is down.
          expr: "absent(up{job=\"mailpit-metrics\", namespace=\"mailpit\"}) or max by (job, namespace) (up{job=\"mailpit-metrics\", namespace=\"mailpit\"}) < 1"
          for: 5m
          labels:
            severity: warning
        - alert: MailpitSMTPRejected
          annotations:
            description: "mailpit/mailpit rejected SMTP messages in the last 15m: unparsable messages, or recipients outside MP_SMTP_ALLOWED_RECIPIENTS."
            summary: Mailpit rejects SMTP messages.
          expr: "sum by (job, namespace) (increase(mailpit_smtp_rejected_total{job=\"mailpit-metrics\", namespace=\"mailpit\"}[15m])) > 0"
          labels:
            severity: warning
