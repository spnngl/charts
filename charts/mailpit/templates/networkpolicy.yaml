{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $rules := list (dict "port" 8025 "from" $np.http.from) (dict "port" 1025 "from" $np.smtp.from) }}
{{- if .Values.secrets.pop3Auth.name }}
{{- $rules = append $rules (dict "port" 1110 "from" $np.pop3.from) }}
{{- end }}
{{- if include "mailpit.metrics" . }}
{{- $rules = append $rules (dict "port" 9090 "from" $np.metrics.from) }}
{{- end }}
{{- $ingress := list }}
{{- range $rules }}
{{- $rule := dict "ports" (list (dict "port" .port "protocol" "TCP")) }}
{{- with .from }}{{ $_ := set $rule "from" . }}{{ end }}
{{- $ingress = append $ingress $rule }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
  name: {{ include "mailpit.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  egress:
    - ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
      {{- with $np.egress.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $np.egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  ingress:
    {{- toYaml $ingress | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "mailpit.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
