{{- if .Values.metrics.serviceMonitor.enabled }}
apiVersion: v1
kind: Service
metadata:
  labels:
    {{- include "mailpit.labels" . | nindent 4 }}
  name: {{ include "mailpit.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: metrics
      port: 9090
      protocol: TCP
      targetPort: metrics
  selector:
    {{- include "mailpit.selectorLabels" . | nindent 4 }}
  type: ClusterIP
{{- end }}
