# Source: artifacthub-exporter/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: artifacthub-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: artifacthub-exporter
    app.kubernetes.io/version: 0.0.0
    helm.sh/chart: artifacthub-exporter-0.0.0
    release: kube-prometheus-stack
  name: artifacthub-exporter
  namespace: artifacthub-exporter
spec:
  groups:
    - name: artifacthub-exporter
      rules:
        - alert: ArtifactHubExporterDown
          annotations:
            description: "No artifacthub-exporter target of artifacthub-exporter/artifacthub-exporter has been up for 10m (pod not running or not scraped; also fires when replicaCount is 0)."
            summary: artifacthub-exporter is down.
          expr: "absent(up{job=\"artifacthub-exporter-metrics\", namespace=\"artifacthub-exporter\"}) or max by (job, namespace) (up{job=\"artifacthub-exporter-metrics\", namespace=\"artifacthub-exporter\"}) < 1"
          for: 10m
          labels:
            severity: critical
        - alert: ArtifactHubCollectionStale
          annotations:
            description: "artifacthub-exporter on {{ $labels.namespace }}/{{ $labels.pod }} has not collected {{ $labels.target }} for more than 7200 seconds: its metrics are stale. Check the logs (Artifact Hub down, rate limited, or a target that no longer exists)."
            summary: An Artifact Hub target is not collected any more.
          expr: "time() - artifacthub_collection_last_success_timestamp_seconds{job=\"artifacthub-exporter-metrics\", namespace=\"artifacthub-exporter\"} > 7200"
          labels:
            severity: warning
        - alert: ArtifactHubCollectionErrors
          annotations:
            description: "artifacthub-exporter on {{ $labels.namespace }}/{{ $labels.pod }} failed to collect {{ $labels.target }} in every 2h window for 2h. Check the logs."
            summary: An Artifact Hub target keeps failing.
          expr: "sum by (namespace, pod, target) (increase(artifacthub_collection_errors_total{job=\"artifacthub-exporter-metrics\", namespace=\"artifacthub-exporter\"}[2h])) > 0"
          for: 2h
          labels:
            severity: warning
