      - port: 8080
        protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: artifacthub-exporter
      app.kubernetes.io/name: artifacthub-exporter
  policyTypes:
    - Ingress
    - Egress
