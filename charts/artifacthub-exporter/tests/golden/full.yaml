apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    ignore-check.kube-linter.io/env-value-from: "The API key Secret is created by the user (artifacthub.apiKey.existingSecret), so it is not in the release."
    ignore-check.kube-linter.io/minimum-three-replicas: "A single exporter on purpose: each replica polls Artifact Hub on its own, against the same rate limit, and exports duplicate series."
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    ignore-check.kube-linter.io/read-secret-from-env-var: "Upstream reads the API key from its flags or its environment only, with no file option."
  labels:
    app.kubernetes.io/instance: artifacthub-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: artifacthub-exporter
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: artifacthub-exporter-0.0.0
  name: artifacthub-exporter
  namespace: artifacthub-exporter
spec:
  minReadySeconds: 30
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/instance: artifacthub-exporter
      app.kubernetes.io/name: artifacthub-exporter
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        example.com/note: hello
      labels:
        app.kubernetes.io/instance: artifacthub-exporter
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: artifacthub-exporter
        app.kubernetes.io/version: 0.0.0
        example.com/team: platform
        helm.sh/chart: artifacthub-exporter-0.0.0
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: ARTIFACTHUB_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: id
                  name: artifacthub-api-key
            - name: ARTIFACTHUB_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  key: secret
                  name: artifacthub-api-key
            - name: ARTIFACTHUB_HUB_STATS
              value: "true"
            - name: ARTIFACTHUB_ORGS
              value: "artifacthub"
            - name: ARTIFACTHUB_PACKAGES
              value: "helm/artifact-hub/artifact-hub"
            - name: ARTIFACTHUB_URL
              value: "https://hub.example.com"
            - name: COLLECT_INTERVAL
              value: "1h30m"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: WEB_ADDR
              value: ":8080"
            - name: WEB_PATH
              value: /metrics
            - name: HTTPS_PROXY
              value: http://proxy.example.com:3128
          image: "ghcr.io/spnngl/images/artifacthub-exporter:0.0.9"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /
              port: http-metrics
            periodSeconds: 10
          name: artifacthub-exporter
          ports:
            - containerPort: 8080
              name: http-metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /
              port: http-metrics
            periodSeconds: 10
          resizePolicy:
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /
              port: http-metrics
            periodSeconds: 2
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /tmp
              name: scratch
      dnsConfig:
        options:
        - name: ndots
          value: "2"
      enableServiceLinks: false
      hostUsers: true
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      restartPolicy: Always
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: artifacthub-exporter
      terminationGracePeriodSeconds: 30
      volumes:
        - emptyDir: {}
          name: scratch
