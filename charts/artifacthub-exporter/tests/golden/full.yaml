apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: artifacthub-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: artifacthub-exporter
