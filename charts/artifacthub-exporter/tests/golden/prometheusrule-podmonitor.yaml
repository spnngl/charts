# Source: artifacthub-exporter/templates/serviceaccount.yaml
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/instance: artifacthub-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: artifacthub-exporter
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: artifacthub-exporter-0.0.0
