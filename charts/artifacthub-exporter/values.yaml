# yaml-language-server: $schema=values.schema.json
# @schema.root
# title: artifacthub-exporter values
# allOf:
#   # a ServiceMonitor and a PodMonitor would scrape the exporter twice
#   - not:
#       required: [metrics]
#       properties:
#         metrics:
#           required: [serviceMonitor, podMonitor]
#           properties:
#             serviceMonitor:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#             podMonitor:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#   # the alert rules select the `job` label set by the ServiceMonitor or PodMonitor
#   - if:
#       required: [metrics]
#       properties:
#         metrics:
#           required: [prometheusRule]
#           properties:
#             prometheusRule:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#     then:
#       properties:
#         metrics:
#           anyOf:
#             - required: [serviceMonitor]
#               properties:
#                 serviceMonitor:
#                   required: [enabled]
#                   properties:
#                     enabled:
#                       const: true
#             - required: [podMonitor]
#               properties:
#                 podMonitor:
#                   required: [enabled]
#                   properties:
#                     enabled:
#                       const: true
# @schema.root
# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Override the full resource name (default `<release>-<chart>`).
fullnameOverride: ""

image:
  # -- Image repository.
  repository: ghcr.io/spnngl/images/artifacthub-exporter
  # -- Image tag. Empty: `appVersion` pinned by the digest recorded in `Chart.yaml`. When set, the chart digest is not applied; add `image.digest` to pin it.
  tag: ""
  # @schema
  # type: string
  # pattern: "^(sha256:[a-f0-9]{64})?$"
  # @schema
  # -- Image digest, only valid together with `image.tag`.
  digest: ""
  # @schema
  # type: string
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
# @schema
# -- Image pull secrets (list of `{name: <secret>}`).
imagePullSecrets: []

artifacthub:
  # @schema
  # type: array
  # uniqueItems: true
  # items:
  #   type: string
  #   pattern: "^[^,\"\\s]+$"
  # @schema
  # -- Organizations to collect (by name): their packages and repositories. An organization costs about 2 seconds per package per collection (see the README): prefer `repositories` or `packages` for large ones.
  orgs: []
  # @schema
  # type: array
  # uniqueItems: true
  # items:
  #   type: string
  #   pattern: "^[^,\"\\s]+$"
  # @schema
  # -- Users to collect (by alias): their packages and repositories.
  users: []
  # @schema
  # type: array
  # uniqueItems: true
  # items:
  #   type: string
  #   pattern: "^[^,\"\\s]+$"
  # @schema
  # -- Repositories to collect (by name), with their packages.
  repositories: []
  # @schema
  # type: array
  # uniqueItems: true
  # items:
  #   type: string
  #   pattern: "^[^/,\"\\s]+/[^/,\"\\s]+/[^/,\"\\s]+$"
  # @schema
  # -- Packages to collect, `kind/repository/name` (`helm/bitnami/redis`). The kind is an Artifact Hub slug (`helm`, `container`, `olm`, ...): the exporter exits at startup on a kind it does not know.
  packages: []
  # @schema
  # type: [boolean, "null"]
  # @schema
  # -- Collect the totals of the hub (`artifacthub_hub_packages`, `artifacthub_hub_releases`): one request per collection. Empty: only when no other target is set, so the default install collects something (the exporter exits at startup without a target).
  hubStats: null
  # @schema
  # type: string
  # pattern: "^https?://\\S+$"
  # @schema
  # -- Artifact Hub address.
  url: https://artifacthub.io
  # @schema
  # type: string
  # pattern: "^(([5-9]|[1-9][0-9]+)m|[1-9][0-9]*h([0-9]+m)?)$"
  # @schema
  # -- Time between two collections, in minutes and hours (`15m`, `1h`, `1h30m`). At least `5m`: the API caches its answers for 5 minutes, and the exporter exits at startup below it. A collection longer than the interval delays the next one.
  collectInterval: 15m
  apiKey:
    existingSecret:
      # -- Name of an existing Secret holding an Artifact Hub API key. Empty: no key (the public API needs none). The chart never creates it: upstream reads the key from its environment only (no file option), so the chart passes it with a `secretKeyRef`.
      name: ""
      # @schema
      # type: string
      # minLength: 1
      # @schema
      # -- Key of the API key id in the Secret.
      idKey: id
      # @schema
      # type: string
      # minLength: 1
      # @schema
      # -- Key of the API key secret in the Secret.
      secretKey: secret

# @schema
# type: integer
# minimum: 0
# @schema
# -- Number of exporters. Keep `1`: every replica polls Artifact Hub on its own (N replicas send N times the requests against the same rate limit, which answers 429 past roughly 100 a minute) and exports the same series (`sum()` counts them twice). An exporter outage only leaves a gap in the graphs. `0` stops the exporter.
replicaCount: 1
# @schema
# type: integer
# minimum: 0
# @schema
# -- Seconds a new pod must be Ready before the old one is retired.
minReadySeconds: 10
# -- Old ReplicaSets to keep.
revisionHistoryLimit: 10
strategy:
  # @schema
  # type: string
  # enum: [RollingUpdate, Recreate]
  # @schema
  # -- Update strategy. `Recreate` stops the old exporter first (a gap in the graphs) instead of overlapping two for `minReadySeconds`.
  type: RollingUpdate
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Used with `RollingUpdate` only.
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Empty: `<fullname>` (or `default` when `create` is false).
  name: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- ServiceAccount annotations.
  annotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Pod annotations (for example `reloader.stakater.com/auto: "true"` to restart on Secret rotation).
podAnnotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Extra pod labels.
podLabels: {}
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Pod security context. Overrides are merged onto these defaults.
podSecurityContext:
  fsGroup: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Container security context. Overrides are merged onto these defaults.
securityContext:
  allowPrivilegeEscalation: false
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: boolean
# @schema
# -- Run the pod in a user namespace (`false`: uid 65532 maps to an unprivileged host uid). Needs node support (containerd 2.0+ or CRI-O, runc 1.2+, kernel 6.3+); pods fail to start otherwise. `true` uses host users.
hostUsers: false
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Resources. Measured on kind: about 10Mi of memory and 0.2s of CPU time for a collection of a repository of 47 packages, the hub totals and one package. Memory grows with the number of packages collected: tune for large organizations. No CPU limit on purpose. With a memory limit, `GOMEMLIMIT` follows it.
resources:
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  limits:
    memory: 128Mi
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  requests:
    cpu: 10m
    memory: 32Mi
# @schema
# type: object
# additionalProperties: true
# @schema
# -- DNS config.
dnsConfig:
  # @schema
  # type: array
  # items:
  #   type: object
  #   additionalProperties: true
  # @schema
  # -- DNS options (fewer search-list lookups for `artifacthub.io`).
  options:
    - name: ndots
      value: "2"

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Startup probe, `/` (upstream has no health endpoint; `/` is a static page). Restarts a pod that does not listen within `periodSeconds` x `failureThreshold` (60s).
startupProbe:
  failureThreshold: 30
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  httpGet:
    path: /
    port: http-metrics
  periodSeconds: 2
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Readiness probe, `/`. It answers 200 once the server listens, whatever Artifact Hub does: `/metrics` serves the last collection.
readinessProbe:
  failureThreshold: 1
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  httpGet:
    path: /
    port: http-metrics
  periodSeconds: 10
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Liveness probe, `/`. An Artifact Hub outage never restarts the pod.
livenessProbe:
  failureThreshold: 3
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  httpGet:
    path: /
    port: http-metrics
  periodSeconds: 10

# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Node selector. Merged with (and cannot drop) the default `kubernetes.io/os: linux`.
nodeSelector:
  kubernetes.io/os: linux
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Tolerations.
tolerations: []
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Affinity. Empty on purpose: a single replica has nothing to spread.
affinity: {}
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Topology spread constraints. Empty on purpose: a single replica has nothing to spread.
topologySpreadConstraints: []
# -- Priority class name.
priorityClassName: ""
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Extra volumes.
extraVolumes: []
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Extra volume mounts for the exporter container.
extraVolumeMounts: []
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
#       minLength: 1
#       not:
#         enum:
#           - ARTIFACTHUB_API_KEY_ID
#           - ARTIFACTHUB_API_KEY_SECRET
#           - ARTIFACTHUB_HUB_STATS
#           - ARTIFACTHUB_ORGS
#           - ARTIFACTHUB_PACKAGES
#           - ARTIFACTHUB_REPOSITORIES
#           - ARTIFACTHUB_URL
#           - ARTIFACTHUB_USERS
#           - COLLECT_INTERVAL
#           - GOMEMLIMIT
#           - WEB_ADDR
#           - WEB_PATH
# @schema
# -- Extra environment variables (`EnvVar` list), for example `HTTPS_PROXY`. Every upstream setting has a value: names the chart owns are rejected. Rendered after `WEB_PATH`.
extraEnv: []

verticalPodAutoscaler:
  # -- Create a VerticalPodAutoscaler (needs the VPA CRDs, see the `vertical-pod-autoscaler-crds` chart).
  enabled: false
  # @schema
  # type: string
  # enum: ["Off", Initial, Recreate, InPlaceOrRecreate]
  # @schema
  # -- VPA update mode. Recommendations only by default.
  updateMode: "Off"
  # @schema
  # type: array
  # items:
  #   type: string
  #   enum: [cpu, memory]
  # @schema
  # -- Resources VPA controls.
  controlledResources:
    - cpu
    - memory
  # @schema
  # type: string
  # enum: [RequestsAndLimits, RequestsOnly]
  # @schema
  # -- Whether VPA also scales limits.
  controlledValues: RequestsAndLimits
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Lower bound of recommendations (for example `{cpu: 25m, memory: 64Mi}`).
  minAllowed: {}
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Upper bound of recommendations.
  maxAllowed: {}

metrics:
  service:
    # -- Render the metrics Service (also rendered when `serviceMonitor.enabled`).
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Service annotations.
    annotations: {}
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor. Exclusive with `podMonitor`.
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Extra labels (for example `release: kube-prometheus-stack`).
    labels: {}
    # -- Scrape interval (empty: Prometheus default).
    interval: ""
    # -- Scrape timeout (empty: Prometheus default).
    scrapeTimeout: ""
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Relabelings.
    relabelings: []
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Metric relabelings.
    metricRelabelings: []
  podMonitor:
    # -- Create a Prometheus Operator PodMonitor (no Service needed). Exclusive with `serviceMonitor`.
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Extra labels.
    labels: {}
    # -- Scrape interval (empty: Prometheus default).
    interval: ""
    # -- Scrape timeout (empty: Prometheus default).
    scrapeTimeout: ""
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Relabelings.
    relabelings: []
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Metric relabelings.
    metricRelabelings: []
  prometheusRule:
    # -- Create a Prometheus Operator PrometheusRule (alerts `ArtifactHubExporterDown`, `ArtifactHubCollectionStale`, `ArtifactHubCollectionErrors`). Needs `serviceMonitor` or `podMonitor`: the rules select the `job` label it sets.
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Extra labels (for example `release: kube-prometheus-stack`).
    labels: {}
    # @schema
    # type: array
    # uniqueItems: true
    # maxItems: 2
    # items:
    #   type: string
    #   enum: [ArtifactHubExporterDown, ArtifactHubCollectionStale, ArtifactHubCollectionErrors]
    # @schema
    # -- Alerts to leave out (at most two: disable `prometheusRule` instead). `ArtifactHubExporterDown` also fires when no target exists (pod Pending) and with `replicaCount: 0`.
    disabled: []
    # @schema
    # type: integer
    # minimum: 300
    # @schema
    # -- `ArtifactHubCollectionStale` threshold, in seconds since a target's last successful collection. Keep it above `artifacthub.collectInterval` plus the duration of a collection (`artifacthub_collection_duration_seconds`), or it fires between two collections.
    collectionStaleSeconds: 3600
    # @schema
    # type: string
    # pattern: "^([0-9]+(ms|s|m|h|d|w|y))+$"
    # @schema
    # -- `ArtifactHubCollectionErrors` window and duration: fires when every window of this length holds a failed collection of a target, for this long: repeated failures, not a single one. Covers targets never collected, which `ArtifactHubCollectionStale` cannot see. Keep it above `artifacthub.collectInterval` plus the duration of a collection, or a target failing every collection never fires it.
    collectionErrorsFor: 1h
    # @schema
    # type: string
    # pattern: "^([0-9]+(ms|s|m|h|d|w|y))+$"
    # @schema
    # -- `ArtifactHubExporterDown` duration.
    downFor: 5m

networkPolicy:
  # -- Create a NetworkPolicy (ingress: port 8080 only).
  enabled: true
  metrics:
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- NetworkPolicyPeer list allowed to reach port 8080. Empty: any source. Restrict it to your Prometheus.
    from: []
  egress:
    # -- Restrict egress (DNS, Artifact Hub, `extraEgress`).
    enabled: false
    dns:
      # @schema
      # type: array
      # items:
      #   type: object
      # @schema
      # -- DNS peers (port 53 TCP/UDP). Override for NodeLocal DNSCache or non-standard labels.
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    artifacthub:
      # @schema
      # type: array
      # items:
      #   type: object
      # @schema
      # -- Artifact Hub peers (port 443). `artifacthub.io` is served by CloudFront, which has no stable address: any address by default. An `artifacthub.url` on another port needs `extraEgress`.
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
        - ipBlock:
            cidr: ::/0
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Extra `NetworkPolicyEgressRule`s (for example a proxy, or a self-hosted Artifact Hub).
    extraEgress: []
