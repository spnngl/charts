{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $ingress := dict "ports" (list (dict "port" 8080 "protocol" "TCP")) }}
{{- with $np.metrics.from }}{{ $_ := set $ingress "from" . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "artifacthub-exporter.labels" . | nindent 4 }}
  name: {{ include "artifacthub-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  egress:
    - ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
      {{- with $np.egress.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    - ports:
        - port: 443
          protocol: TCP
      {{- with $np.egress.artifacthub.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $np.egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  ingress:
    {{- toYaml (list $ingress) | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "artifacthub-exporter.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
