{{- include "artifacthub-exporter.validate" . }}
{{- $memLimit := dig "limits" "memory" "" .Values.resources }}
{{- $apiKey := .Values.artifacthub.apiKey.existingSecret }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    {{- if $apiKey.name }}
    ignore-check.kube-linter.io/env-value-from: "The API key Secret is created by the user (artifacthub.apiKey.existingSecret), so it is not in the release."
    {{- end }}
    ignore-check.kube-linter.io/minimum-three-replicas: "A single exporter on purpose: each replica polls Artifact Hub on its own, against the same rate limit, and exports duplicate series."
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    {{- if not .Values.networkPolicy.enabled }}
    ignore-check.kube-linter.io/non-isolated-pod: "networkPolicy.enabled is false: the user isolates the pod, or chooses not to."
    {{- end }}
    {{- if ne .Values.strategy.type "RollingUpdate" }}
    ignore-check.kube-linter.io/no-rolling-update-strategy: "strategy.type is Recreate: the old exporter stops first, so two never poll Artifact Hub at once."
    {{- end }}
    {{- if $apiKey.name }}
    ignore-check.kube-linter.io/read-secret-from-env-var: "Upstream reads the API key from its flags or its environment only, with no file option."
    {{- end }}
  labels:
    {{- include "artifacthub-exporter.labels" . | nindent 4 }}
  name: {{ include "artifacthub-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "artifacthub-exporter.selectorLabels" . | nindent 6 }}
  strategy:
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.strategy.rollingUpdate | nindent 6 }}
    {{- end }}
    type: {{ .Values.strategy.type }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- toYaml (merge (include "artifacthub-exporter.labels" . | fromYaml) (deepCopy .Values.podLabels)) | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - env:
            {{- with $apiKey.name }}
            - name: ARTIFACTHUB_API_KEY_ID
              valueFrom:
                secretKeyRef:
                  key: {{ $apiKey.idKey }}
                  name: {{ . }}
            - name: ARTIFACTHUB_API_KEY_SECRET
              valueFrom:
                secretKeyRef:
                  key: {{ $apiKey.secretKey }}
                  name: {{ . }}
            {{- end }}
            - name: ARTIFACTHUB_HUB_STATS
              value: {{ include "artifacthub-exporter.hubStats" . | quote }}
            {{- with .Values.artifacthub.orgs }}
            - name: ARTIFACTHUB_ORGS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.artifacthub.packages }}
            - name: ARTIFACTHUB_PACKAGES
              value: {{ join "," . | quote }}
            {{- end }}
            {{- with .Values.artifacthub.repositories }}
            - name: ARTIFACTHUB_REPOSITORIES
              value: {{ join "," . | quote }}
            {{- end }}
            - name: ARTIFACTHUB_URL
              value: {{ .Values.artifacthub.url | quote }}
            {{- with .Values.artifacthub.users }}
            - name: ARTIFACTHUB_USERS
              value: {{ join "," . | quote }}
            {{- end }}
            - name: COLLECT_INTERVAL
              value: {{ .Values.artifacthub.collectInterval | quote }}
            {{- if $memLimit }}
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            {{- end }}
            - name: WEB_ADDR
              value: ":8080"
            - name: WEB_PATH
              value: /metrics
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          image: {{ include "artifacthub-exporter.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          name: artifacthub-exporter
          ports:
            - containerPort: 8080
              name: http-metrics
              protocol: TCP
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          {{- if $memLimit }}
          resizePolicy:
            - resourceName: memory
              restartPolicy: RestartContainer
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          terminationMessagePolicy: FallbackToLogsOnError
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      enableServiceLinks: false
      hostUsers: {{ .Values.hostUsers }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      restartPolicy: Always
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "artifacthub-exporter.serviceAccountName" . }}
      {{- /* Upstream drains scrapes for up to 20 s on SIGTERM (cmd/artifacthub-exporter/main.go, shutdownTimeout). */}}
      terminationGracePeriodSeconds: 30
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
