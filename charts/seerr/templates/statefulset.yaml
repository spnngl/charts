{{- include "seerr.validate" . }}
{{- $fullname := include "seerr.fullname" . }}
{{- $config := .Values.persistence.config }}
{{- $db := .Values.externalDatabase }}
{{- $probe := dict "httpGet" (dict "path" "/api/v1/status/appdata" "port" "http") }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  annotations:
    {{- if include "seerr.envRefs" . }}
    ignore-check.kube-linter.io/env-value-from: "The Secrets and ConfigMaps the env reads are created by the user, outside the chart."
    {{- end }}
    ignore-check.kube-linter.io/minimum-three-replicas: "One replica on purpose: Seerr is the single writer of /app/config and of its SQLite database."
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    {{- if not .Values.networkPolicy.enabled }}
    ignore-check.kube-linter.io/non-isolated-pod: "networkPolicy.enabled is false: isolation is the user's choice."
    {{- end }}
    {{- if contains "secret" (include "seerr.envRefs" .) }}
    ignore-check.kube-linter.io/read-secret-from-env-var: "Seerr reads its API key and database password from env only, never from a file."
    {{- end }}
    {{- if eq $config.type "hostPath" }}
    ignore-check.kube-linter.io/writable-host-mount: "A hostPath volume is the user's choice (persistence.config.type: hostPath)."
    {{- end }}
  labels:
    {{- include "seerr.labels" . | nindent 4 }}
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "seerr.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- toYaml (merge (include "seerr.labels" . | fromYaml) (deepCopy .Values.podLabels)) | nindent 8 }}
    spec:
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      containers:
        - env:
            {{- /* Upstream defaults to debug, which logs every request. extraEnv wins. */}}
            {{- $logLevel := true }}
            {{- range .Values.extraEnv }}
            {{- if eq .name "LOG_LEVEL" }}
            {{- $logLevel = false }}
            {{- end }}
            {{- end }}
            {{- if $logLevel }}
            - name: LOG_LEVEL
              value: info
            {{- end }}
            - name: PORT
              value: "5055"
            {{- with .Values.apiKey.existingSecret.name }}
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  key: {{ $.Values.apiKey.existingSecret.key }}
                  name: {{ . }}
            {{- end }}
            {{- if $db.enabled }}
            - name: DB_TYPE
              value: postgres
            - name: DB_HOST
              value: {{ $db.host | quote }}
            - name: DB_PORT
              value: {{ int $db.port | quote }}
            - name: DB_NAME
              value: {{ $db.database | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  key: {{ $db.existingSecret.usernameKey }}
                  name: {{ $db.existingSecret.name }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  key: {{ $db.existingSecret.passwordKey }}
                  name: {{ $db.existingSecret.name }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          image: {{ include "seerr.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            {{- toYaml (merge (deepCopy $probe) (deepCopy .Values.livenessProbe)) | nindent 12 }}
          name: seerr
          ports:
            - containerPort: 5055
              name: http
              protocol: TCP
          readinessProbe:
            {{- toYaml (merge (deepCopy $probe) (deepCopy .Values.readinessProbe)) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            {{- toYaml (merge (deepCopy $probe) (deepCopy .Values.startupProbe)) | nindent 12 }}
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /app/config
              name: config
              {{- if and (eq $config.type "existingClaim") $config.existingClaim.subPath }}
              subPath: {{ $config.existingClaim.subPath }}
              {{- end }}
            - mountPath: /app/.next/cache
              name: cache
            - mountPath: /tmp
              name: tmp
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      enableServiceLinks: false
      hostUsers: {{ .Values.hostUsers }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.extraInitContainers }}
      initContainers:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      restartPolicy: Always
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "seerr.serviceAccountName" . }}
      {{- /* Seerr has no SIGTERM handler and node is PID 1: a stop always waits out the grace period, then SIGKILL. */}}
      terminationGracePeriodSeconds: 5
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        {{- with include "seerr.configVolume" . }}
        {{- . | nindent 8 }}
        {{- end }}
        - emptyDir:
            {{- with .Values.persistence.cache.sizeLimit }}
            sizeLimit: {{ . }}
            {{- end }}
          name: cache
        - emptyDir: {}
          name: tmp
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  updateStrategy:
    type: RollingUpdate
  {{- /* Template metadata carries no chart labels: a volumeClaimTemplate is immutable, a version label would fail every upgrade. */}}
  {{- if eq $config.type "volumeClaimTemplate" }}
  {{- $t := $config.volumeClaimTemplate }}
  volumeClaimTemplates:
    - metadata:
        {{- with $t.annotations }}
        annotations:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        {{- with $t.labels }}
        labels:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        name: config
      spec:
        accessModes:
          {{- toYaml $t.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ $t.size }}
        {{- with $t.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
  {{- end }}
