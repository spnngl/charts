# yaml-language-server: $schema=values.schema.json
# @schema.root
# title: cryptgeon values
# @schema.root
# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Override the full resource name (default `<release>-<chart>`).
fullnameOverride: ""

image:
  # -- Image repository.
  repository: ghcr.io/spnngl/images/cryptgeon
  # -- Image tag. Empty: the tag and digest recorded for `image.repository` in the `artifacthub.io/images` annotation of `Chart.yaml`. When set, the chart digest is not applied; add `image.digest` to pin it.
  tag: ""
  # @schema
  # type: string
  # pattern: "^(sha256:[a-f0-9]{64})?$"
  # @schema
  # -- Image digest, only valid together with `image.tag`.
  digest: ""
  # @schema
  # type: string
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
# @schema
# -- Image pull secrets (list of `{name: <secret>}`).
imagePullSecrets: []

redis:
  existingSecret:
    # -- Name of the Secret holding the Redis URL. Empty: `<fullname>`. The chart never creates it: the URL can carry a password.
    name: ""
    # @schema
    # type: string
    # minLength: 1
    # @schema
    # -- Key of the URL in the Secret (`redis://[:password@]host[:port]/[db]`; the image has no TLS client, `rediss://` fails at startup). Read once at startup: restart the pod after changing it.
    key: url

# @schema
# type: object
# additionalProperties: false
# properties:
#   SIZE_LIMIT:
#     type: string
#     minLength: 1
#   MAX_VIEWS:
#     type: integer
#     minimum: 1
#     maximum: 4294967295
#   MAX_EXPIRATION:
#     type: integer
#     minimum: 1
#     maximum: 4294967295
#   ID_LENGTH:
#     type: integer
#     minimum: 1
#     maximum: 4294967295
#   ALLOW_ADVANCED:
#     type: boolean
#   ALLOW_FILES:
#     type: boolean
#   THEME_NEW_NOTE_NOTICE:
#     type: boolean
#   THEME_HOME_LINK:
#     type: boolean
#   IMPRINT_URL:
#     type: string
#   IMPRINT_HTML:
#     type: string
#   THEME_IMAGE:
#     type: string
#   THEME_TEXT:
#     type: string
#   THEME_PAGE_TITLE:
#     type: string
#   THEME_FAVICON:
#     type: string
# @schema
# -- Cryptgeon settings (upstream environment variable names), rendered into a ConfigMap read through `envFrom`. A key left out keeps the upstream default. Upstream parses every value at startup and panics on a bad one, so the schema types each key and rejects the others (`VERBOSITY` is unused upstream; `REDIS`, `LISTEN_ADDR` and `FRONTEND_PATH` belong to the chart and the image; use `extraEnv` for a setting added upstream later). Upstream defaults: `MAX_VIEWS` 100, `MAX_EXPIRATION` 360 (minutes), `ID_LENGTH` 32, `ALLOW_ADVANCED` true, `ALLOW_FILES` true, `THEME_NEW_NOTE_NOTICE` true, `THEME_HOME_LINK` true, the others empty. `SIZE_LIMIT` is the maximum request body, files included (upstream default `1 KiB`, maximum `512 MiB`); the whole body is buffered in memory, and the browser adds about 35 % of encoding overhead to a file.
config:
  SIZE_LIMIT: 20 MiB

service:
  # @schema
  # type: string
  # enum: [ClusterIP, LoadBalancer, NodePort]
  # @schema
  # -- Service type.
  type: ClusterIP
  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- Service port (the container listens on 8000).
  port: 8000
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Service annotations.
  annotations: {}

ingress:
  # -- Create an Ingress (path `/`). Cryptgeon needs HTTPS (WebCrypto): terminate TLS here or in front.
  enabled: false
  # -- Ingress class name (empty: cluster default).
  className: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Ingress annotations (for ingress-nginx, `nginx.ingress.kubernetes.io/proxy-body-size` must exceed `config.SIZE_LIMIT`).
  annotations: {}
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Extra Ingress labels (for example the label an external-dns `--label-filter` selects).
  labels: {}
  # @schema
  # type: array
  # items:
  #   type: string
  #   minLength: 1
  # @schema
  # -- Host names. Required when enabled.
  hosts: []
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Ingress TLS blocks (`secretName`, `hosts`).
  tls: []

httpRoute:
  # -- Create a Gateway API HTTPRoute (path prefix `/`). Cryptgeon needs HTTPS (WebCrypto): terminate TLS on the Gateway.
  enabled: false
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- HTTPRoute annotations.
  annotations: {}
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Extra HTTPRoute labels.
  labels: {}
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Gateways (`parentRefs`). Required when enabled.
  parentRefs: []
  # @schema
  # type: array
  # items:
  #   type: string
  #   minLength: 1
  # @schema
  # -- Host names (empty: any host of the Gateway listener).
  hostnames: []

# @schema
# type: integer
# enum: [0, 1]
# @schema
# -- Replicas, 0 or 1. Never more: the view counter is guarded by an in-process lock, so with two instances a note can be read more often than its view limit. `0` stops the app (maintenance). The Deployment uses the `Recreate` strategy (short downtime on every upgrade) so two instances never overlap.
replicaCount: 1
# -- Old ReplicaSets to keep.
revisionHistoryLimit: 3

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Empty: `<fullname>` (or `default` when `create` is false).
  name: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- ServiceAccount annotations.
  annotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Pod annotations.
podAnnotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Extra pod labels.
podLabels: {}
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Pod security context. Overrides are merged onto these defaults.
podSecurityContext:
  fsGroup: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Container security context. Overrides are merged onto these defaults.
securityContext:
  allowPrivilegeEscalation: false
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: boolean
# @schema
# -- Run the pod in a user namespace (`false`: uid 65532 maps to an unprivileged host uid). Needs node support (containerd 2.0+ or CRI-O, runc 1.2+, kernel 6.3+); pods fail to start otherwise. `true` uses host users.
hostUsers: false
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Resources. The memory limit bounds uploads: a request body is buffered in memory, so size it from `config.SIZE_LIMIT` times the concurrent uploads you expect (measure, then tune; VPA in `Off` mode gives recommendations). No CPU limit on purpose.
resources:
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  limits:
    memory: 256Mi
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  requests:
    cpu: 10m
    memory: 32Mi
# @schema
# type: object
# additionalProperties: true
# @schema
# -- DNS config.
dnsConfig:
  # @schema
  # type: array
  # items:
  #   type: object
  #   additionalProperties: true
  # @schema
  # -- DNS options (fewer search-list lookups for the Redis host name).
  options:
    - name: ndots
      value: "2"

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Readiness probe (`GET /api/live`: answers 503 while Redis is unreachable, which only removes the pod from the Service).
readinessProbe:
  failureThreshold: 3
  periodSeconds: 10
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Liveness probe (`GET /api/status`: does not touch Redis, so a Redis outage never restarts the pod).
livenessProbe:
  failureThreshold: 3
  periodSeconds: 10

# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Node selector.
nodeSelector:
  kubernetes.io/os: linux
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Tolerations.
tolerations: []
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Affinity.
affinity: {}
# -- Priority class name.
priorityClassName: ""
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
#       minLength: 1
#       not:
#         enum: [REDIS, LISTEN_ADDR, FRONTEND_PATH]
# @schema
# -- Extra environment variables (`EnvVar` list). Chart- and image-owned names are rejected. They win over `config`.
extraEnv: []
# @schema
# type: array
# items:
#   type: string
#   minLength: 1
# @schema
# -- Extra arguments for the `cryptgeon` binary, which takes none today.
extraArgs: []

networkPolicy:
  # -- Create a NetworkPolicy (ingress: the HTTP port).
  enabled: true
  http:
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- NetworkPolicyPeer list allowed to reach the HTTP port (your ingress controller or Gateway). Empty: any source.
    from: []
  egress:
    # -- Restrict egress (DNS and `extraEgress`). Add a rule to the Redis pods in `extraEgress`: without it the app cannot reach Redis.
    enabled: false
    dns:
      # @schema
      # type: array
      # items:
      #   type: object
      # @schema
      # -- DNS peers (port 53 TCP/UDP). Override for NodeLocal DNSCache or non-standard labels.
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Extra `NetworkPolicyEgressRule`s (the Redis pods).
    extraEgress: []

verticalPodAutoscaler:
  # -- Create a VerticalPodAutoscaler (needs the VPA CRDs, see the `vertical-pod-autoscaler-crds` chart).
  enabled: false
  # @schema
  # type: string
  # enum: ["Off", Initial, Recreate, InPlaceOrRecreate]
  # @schema
  # -- VPA update mode.
  updateMode: "Off"
  # @schema
  # type: string
  # @schema
  # -- Recommender name (`spec.recommenders`, which takes at most one). Empty: the recommender named `default`. Set it when the cluster's recommender runs under another `--recommender-name`: a VPA nobody serves gets no recommendation.
  recommender: ""
  # @schema
  # type: array
  # items:
  #   type: string
  #   enum: [cpu, memory]
  # @schema
  # -- Resources VPA controls.
  controlledResources:
    - cpu
    - memory
  # @schema
  # type: string
  # enum: [RequestsAndLimits, RequestsOnly]
  # @schema
  # -- Whether VPA also scales limits.
  controlledValues: RequestsAndLimits
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Lower bound of recommendations (for example `{cpu: 25m, memory: 64Mi}`).
  minAllowed: {}
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Upper bound of recommendations.
  maxAllowed: {}
