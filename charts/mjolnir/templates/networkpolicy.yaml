{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $rules := list }}
{{- if .Values.metrics.enabled }}
{{- $metrics := dict "ports" (list (dict "port" 9090 "protocol" "TCP")) }}
{{- with $np.metrics.from }}{{ $_ := set $metrics "from" . }}{{ end }}
{{- $rules = append $rules $metrics }}
{{- end }}
{{- if include "mjolnir.webEnabled" . }}
{{- $web := dict "ports" (list (dict "port" 8081 "protocol" "TCP")) }}
{{- with $np.web.from }}{{ $_ := set $web "from" . }}{{ end }}
{{- $rules = append $rules $web }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "mjolnir.labels" . | nindent 4 }}
  name: {{ include "mjolnir.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  egress:
    {{- include "mjolnir.egress" . | nindent 4 }}
  {{- end }}
  {{- if $rules }}
  ingress:
    {{- toYaml $rules | nindent 4 }}
  {{- else }}
  ingress: []
  {{- end }}
  podSelector:
    matchLabels:
      {{- include "mjolnir.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
