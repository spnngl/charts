{{- if include "mjolnir.webEnabled" . }}
apiVersion: v1
kind: Service
metadata:
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "mjolnir.labels" . | nindent 4 }}
  name: {{ include "mjolnir.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: {{ .Values.service.port }}
      protocol: TCP
      targetPort: http
  selector:
    {{- include "mjolnir.selectorLabels" . | nindent 4 }}
  type: {{ .Values.service.type }}
{{- end }}
