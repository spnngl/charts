# Source: mjolnir/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: mjolnir
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: bot
    app.kubernetes.io/version: 0.0.0
    helm.sh/chart: mjolnir-0.0.0
    release: prometheus
  name: mjolnir-full
  namespace: mjolnir
spec:
  groups:
    - name: mjolnir-full
      rules:
        - alert: MjolnirDown
          annotations:
            description: "No mjolnir target of mjolnir/mjolnir-full has been up for 5m (pod not running or not scraped; also fires when replicaCount is 0)."
            summary: Mjolnir is down.
          expr: "absent(up{job=\"mjolnir/mjolnir-full\", namespace=\"mjolnir\"}) or max by (job, namespace) (up{job=\"mjolnir/mjolnir-full\", namespace=\"mjolnir\"}) < 1"
          for: 5m
          labels:
            severity: critical
        - alert: MjolnirHomeserverUnreachable
          annotations:
            description: "Mjolnir on {{ $labels.namespace }}/{{ $labels.pod }} cannot reach its homeserver: more than 0.1 of its requests failed at the transport level (DNS, connection refused, timeout) over 5m, for 10m. Check config.homeserverUrl, the NetworkPolicy and the homeserver."
            summary: Mjolnir cannot reach its homeserver.
          expr: "sum by (namespace, pod) (rate(mjolnir_status_api_request_fail{job=\"mjolnir/mjolnir-full\", namespace=\"mjolnir\"}[5m])) / sum by (namespace, pod) (rate(mjolnir_status_api_request_pass{job=\"mjolnir/mjolnir-full\", namespace=\"mjolnir\"}[5m]) + rate(mjolnir_status_api_request_fail{job=\"mjolnir/mjolnir-full\", namespace=\"mjolnir\"}[5m])) > 0.1"
          for: 10m
          labels:
            severity: warning
