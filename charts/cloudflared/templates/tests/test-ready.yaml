{{- /* Nothing to dial without connectors (replicaCount 0, as in ct install). */}}
{{- if and (include "cloudflared.metricsService" .) (or .Values.autoscaling.enabled (gt (int .Values.replicaCount) 0)) }}
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    ignore-check.kube-linter.io/no-liveness-probe: "One-shot hook pod that exits within seconds."
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    ignore-check.kube-linter.io/no-readiness-probe: "One-shot hook pod that exits within seconds."
    ignore-check.kube-linter.io/non-isolated-pod: "Short-lived test pod that only dials the metrics Service."
    ignore-check.kube-linter.io/restart-policy: "Never makes a failing helm test fail fast instead of retrying until the timeout."
    ignore-check.kube-linter.io/unsafe-sysctls: "The default sysctls are Kubernetes safe sysctls; the check's list predates them."
  labels:
    {{- toYaml (merge (dict "app.kubernetes.io/component" "test" "app.kubernetes.io/name" (printf "%s-test" (include "cloudflared.name" .))) (include "cloudflared.labels" . | fromYaml)) | nindent 4 }}
  name: {{ include "cloudflared.fullname" . }}-test-ready
  namespace: {{ .Release.Namespace }}
spec:
  automountServiceAccountToken: false
  containers:
    - args:
        - tunnel
        - --metrics
        - {{ printf "%s-metrics.%s.svc:%d" (include "cloudflared.fullname" .) .Release.Namespace (int .Values.metrics.service.port) | quote }}
        - ready
      image: {{ include "cloudflared.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      name: ready
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
  dnsConfig:
    {{- toYaml .Values.dnsConfig | nindent 4 }}
  enableServiceLinks: false
  hostUsers: {{ .Values.hostUsers }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
{{- end }}
