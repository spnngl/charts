# Source: cloudflared/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: cloudflared
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/version: 2026.10.0
    helm.sh/chart: cloudflared-0.2.0
    release: kube-prometheus-stack
  name: cloudflared
  namespace: cloudflared
spec:
  groups:
    - name: cloudflared
      rules:
        - alert: CloudflaredTunnelDown
          annotations:
            description: "No ready cloudflared replica in cloudflared/cloudflared for 5 minutes: the tunnel has no edge connection from this cluster (readiness is cloudflared /ready)."
            summary: Cloudflare Tunnel is down.
          expr: "kube_deployment_status_replicas_available{namespace=\"cloudflared\", deployment=\"cloudflared\"} < 1 and on (namespace, deployment) kube_deployment_spec_replicas{namespace=\"cloudflared\", deployment=\"cloudflared\"} > 0"
          for: 5m
          labels:
            severity: critical
        - alert: CloudflaredRegistrationFailing
          annotations:
            description: "{{ $labels.namespace }}/{{ $labels.pod }} has failed to register tunnel connections for 15 minutes (invalid or revoked token, deleted tunnel): check its logs."
            summary: cloudflared cannot register tunnel connections.
          expr: "sum by (namespace, pod) (increase(cloudflared_tunnel_tunnel_register_fail{job=\"cloudflared-metrics\", namespace=\"cloudflared\"}[10m])) > 0"
          for: 15m
          labels:
            severity: warning
        - alert: CloudflaredOriginErrors
          annotations:
            description: "{{ $value | humanizePercentage }} of the requests proxied by cloudflared/cloudflared failed to reach the origin for 15 minutes."
            summary: cloudflared cannot reach its origins.
          expr: "sum(rate(cloudflared_tunnel_request_errors{job=\"cloudflared-metrics\", namespace=\"cloudflared\"}[5m])) / sum(rate(cloudflared_tunnel_total_requests{job=\"cloudflared-metrics\", namespace=\"cloudflared\"}[5m])) > 0.05"
          for: 15m
          labels:
            severity: warning
