# yaml-language-server: $schema=https://json.schemastore.org/chart.json
apiVersion: v2
name: cloudflared
description: Cloudflare Tunnel connector (cloudflared) running as a hardened, highly available Deployment
type: application
version: 0.2.2
# renovate: datasource=docker depName=docker.io/cloudflare/cloudflared
appVersion: "2026.10.1"
kubeVersion: ">=1.33.0-0"
home: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
icon: https://avatars.githubusercontent.com/u/314135?s=200
sources:
  - https://github.com/spnngl/charts
  - https://github.com/cloudflare/cloudflared
keywords:
  - cloudflare
  - cloudflared
  - tunnel
  - zero-trust
maintainers:
  - name: spnngl
    url: https://github.com/spnngl
annotations:
  artifacthub.io/license: Apache-2.0
  # The pinned digest is the default image (templates/_helpers.tpl,
  # cloudflared.image). Renovate updates tag and digest together.
  artifacthub.io/images: |
    - name: cloudflared
      image: docker.io/cloudflare/cloudflared:2026.10.1@sha256:a15a3b50b8dabd57ac2090e9484c0247dba9dfa1f0df4d298d4317f9d69eb2d5
  artifacthub.io/links: |-
    - name: Upstream project
      url: https://developers.cloudflare.com/cloudflare-one/connections/connect-networks/
    - name: Upstream repository
      url: https://github.com/cloudflare/cloudflared
    - name: Chart source
      url: https://github.com/spnngl/charts/tree/main/charts/cloudflared
    - name: Verify signature and attestations
      url: https://github.com/spnngl/charts#verifying-what-you-install
