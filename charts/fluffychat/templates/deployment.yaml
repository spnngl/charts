{{- $selector := include "fluffychat.selectorLabels" . | fromYaml }}
{{- $antiAffinity := dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "podAffinityTerm" (dict "labelSelector" (dict "matchLabels" $selector) "topologyKey" "kubernetes.io/hostname") "weight" 100))) }}
{{- $spread := .Values.topologySpreadConstraints | default (list (dict "labelSelector" (dict "matchLabels" $selector) "maxSkew" 1 "topologyKey" "topology.kubernetes.io/zone" "whenUnsatisfiable" "ScheduleAnyway")) }}
{{- $probe := dict "httpGet" (dict "path" "/health" "port" "http") }}
{{- /* A dict, not literal YAML: extraArgs and extraEnv come before image in the sorted keys, and a list item cannot start with an optional key. */}}
{{- $container := dict
  "image" (include "fluffychat.image" .)
  "imagePullPolicy" .Values.image.pullPolicy
  "livenessProbe" (merge (deepCopy $probe) (deepCopy .Values.livenessProbe))
  "name" "fluffychat"
  "ports" (list (dict "containerPort" 8080 "name" "http" "protocol" "TCP"))
  "readinessProbe" (merge (deepCopy $probe) (deepCopy .Values.readinessProbe))
  "resources" .Values.resources
  "securityContext" .Values.securityContext
  "startupProbe" (merge (deepCopy $probe) (deepCopy .Values.startupProbe))
  "terminationMessagePolicy" "FallbackToLogsOnError"
  "volumeMounts" (concat (list (dict "mountPath" "/app/config.json" "name" "config" "readOnly" true "subPath" "config.json") (dict "mountPath" "/sws.toml" "name" "config" "readOnly" true "subPath" "sws.toml")) .Values.extraVolumeMounts) }}
{{- with .Values.extraArgs }}{{ $_ := set $container "args" . }}{{ end }}
{{- with .Values.extraEnv }}{{ $_ := set $container "env" . }}{{ end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    {{- if lt (int .Values.replicaCount) 3 }}
    ignore-check.kube-linter.io/minimum-three-replicas: "replicaCount is below three: the user's choice."
    {{- end }}
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    {{- if not .Values.networkPolicy.enabled }}
    ignore-check.kube-linter.io/non-isolated-pod: "networkPolicy.enabled is false: isolation is the user's choice."
    {{- end }}
  labels:
    {{- include "fluffychat.labels" . | nindent 4 }}
  name: {{ include "fluffychat.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "fluffychat.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        {{- toYaml (merge (dict "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum)) (deepCopy .Values.podAnnotations)) | nindent 8 }}
      labels:
        {{- toYaml (merge (include "fluffychat.labels" . | fromYaml) (deepCopy .Values.podLabels)) | nindent 8 }}
    spec:
      affinity:
        {{- toYaml (merge (deepCopy .Values.affinity) $antiAffinity) | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        {{- toYaml (list $container) | nindent 8 }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      enableServiceLinks: false
      hostUsers: {{ .Values.hostUsers }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      restartPolicy: Always
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "fluffychat.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $spread | nindent 8 }}
      volumes:
        {{- toYaml (concat (list (dict "configMap" (dict "name" (include "fluffychat.fullname" .)) "name" "config")) .Values.extraVolumes) | nindent 8 }}
