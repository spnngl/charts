{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $http := dict "ports" (list (dict "port" 8080 "protocol" "TCP")) }}
{{- with $np.http.from }}{{ $_ := set $http "from" . }}{{ end }}
{{- $ingress := list $http }}
{{- /* The metrics port is the app port: a second rule only adds peers, so it needs a restricting http.from. */}}
{{- if and .Values.metrics.enabled $np.http.from $np.metrics.from }}
{{- $ingress = append $ingress (dict "from" $np.metrics.from "ports" (list (dict "port" 8080 "protocol" "TCP"))) }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "fluffychat.labels" . | nindent 4 }}
  name: {{ include "fluffychat.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ingress:
    {{- toYaml $ingress | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "fluffychat.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
