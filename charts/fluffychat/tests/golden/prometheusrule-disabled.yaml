apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: fluffychat
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: fluffychat
    app.kubernetes.io/version: 0.0.0
    helm.sh/chart: fluffychat-0.0.0
    release: kube-prometheus-stack
  name: fluffychat
  namespace: fluffychat
spec:
  groups:
    - name: fluffychat
      rules:
        - alert: FluffyChatDown
          annotations:
            description: "fluffychat/fluffychat has been down or absent from the scrape targets for 10m: the pods are crashing, not running, or scaled to 0."
            summary: FluffyChat is down.
          expr: "absent(up{job=\"fluffychat\", namespace=\"fluffychat\"}) or max by (job, namespace) (up{job=\"fluffychat\", namespace=\"fluffychat\"}) < 1"
          for: 10m
          labels:
            severity: warning
