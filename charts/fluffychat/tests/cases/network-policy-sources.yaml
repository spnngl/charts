values:
  networkPolicy:
    http:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - ipBlock:
            cidr: 10.0.0.0/8
    metrics:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
# metrics is off: networkPolicy.metrics.from is ignored.
