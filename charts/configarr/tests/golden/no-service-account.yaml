metadata:
  labels:
    app.kubernetes.io/instance: configarr
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: configarr
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: configarr-0.0.0
  name: configarr
  namespace: configarr
