values:
  schedule: "30 */6 * * *"
  config: |
    trashGuideUrl: https://github.com/TRaSH-Guides/Guides
    radarr:
      main:
        base_url: http://radarr.media.svc:7878
        api_key: !env RADARR_API_KEY
        quality_definition:
          type: movie
    sonarr:
      main:
        base_url: http://sonarr.media.svc:8989
        api_key: !secret SONARR_API_KEY
  secrets:
    existingSecret:
      name: configarr-secrets
  persistence:
    repos:
      enabled: true
      storageClassName: fast
      size: 2Gi
  serviceAccount:
    annotations:
      example.com/owner: media
  podAnnotations:
    example.com/scrape: "false"
  podLabels:
    team: media
  imagePullSecrets:
    - name: ghcr
  tolerations:
    - key: media
      operator: Exists
      effect: NoSchedule
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 1
          preference:
            matchExpressions:
              - key: example.com/zone
                operator: In
                values: [a]
  priorityClassName: low
  extraVolumes:
    - name: cfs
      configMap:
        name: configarr-cfs
  extraVolumeMounts:
    - name: cfs
      mountPath: /app/cfs
      readOnly: true
  extraEnv:
    - name: RADARR_API_KEY
      valueFrom:
        secretKeyRef:
          name: radarr-api
          key: api-key
    - name: LOG_FORMAT
      value: json
  networkPolicy:
    egress:
      enabled: true
      extraEgress:
        - to:
            - namespaceSelector:
                matchLabels:
                  kubernetes.io/metadata.name: media
          ports:
            - port: 7878
              protocol: TCP
