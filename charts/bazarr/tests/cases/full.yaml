values:
  hostUsers: true
  config:
    general:
      base_url: /bazarr
    auth:
      type: basic
      username: admin
  apiKey:
    existingSecret:
      name: bazarr-api
  externalDatabase:
    enabled: true
    host: pg.example.com
    existingSecret:
      name: bazarr-db
  service:
    annotations:
      a: b
  ingress:
    enabled: true
    hosts: [bazarr.example.com]
  httpRoute:
    enabled: true
    parentRefs:
      - name: gw
  podAnnotations:
    a: b
  podLabels:
    team: media
  extraArgs: [--debug, --no-signalr]
  extraEnv:
    - name: DYNACONF_GENERAL__debug
      value: "true"
  extraVolumes:
    - name: x
      emptyDir: {}
  extraVolumeMounts:
    - name: x
      mountPath: /x
  networkPolicy:
    http:
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
    egress:
      enabled: true
  verticalPodAutoscaler:
    enabled: true
