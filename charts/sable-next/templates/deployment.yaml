{{- include "sable-next.validate" . }}
{{- $selector := include "sable-next.selectorLabels" . | fromYaml }}
{{- $antiAffinity := dict "podAntiAffinity" (dict "preferredDuringSchedulingIgnoredDuringExecution" (list (dict "podAffinityTerm" (dict "labelSelector" (dict "matchLabels" $selector) "topologyKey" "kubernetes.io/hostname") "weight" 100))) }}
{{- $spread := .Values.topologySpreadConstraints | default (list (dict "labelSelector" (dict "matchLabels" $selector) "maxSkew" 1 "topologyKey" "topology.kubernetes.io/zone" "whenUnsatisfiable" "ScheduleAnyway")) }}
{{- $mounts := .Values.extraVolumeMounts }}
{{- $volumes := .Values.extraVolumes }}
{{- if .Values.config }}
{{- $mounts = concat (list (dict "mountPath" "/app/config.json" "name" "config" "readOnly" true "subPath" "config.json")) $mounts }}
{{- $volumes = concat (list (dict "configMap" (dict "name" (include "sable-next.fullname" .)) "name" "config")) $volumes }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    {{- if lt (int .Values.replicaCount) 3 }}
    ignore-check.kube-linter.io/minimum-three-replicas: "replicaCount is below 3: availability is the user's choice."
    {{- end }}
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    {{- if not .Values.networkPolicy.enabled }}
    ignore-check.kube-linter.io/non-isolated-pod: "networkPolicy.enabled is false: isolation is the user's choice."
    {{- end }}
  labels:
    {{- include "sable-next.labels" . | nindent 4 }}
  name: {{ include "sable-next.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "sable-next.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        {{- toYaml (merge (dict "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum)) (deepCopy .Values.podAnnotations)) | nindent 8 }}
      labels:
        {{- toYaml (merge (include "sable-next.labels" . | fromYaml) (deepCopy .Values.podLabels)) | nindent 8 }}
    spec:
      affinity:
        {{- toYaml (merge (deepCopy .Values.affinity) $antiAffinity) | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        {{- if .Values.extraEnv }}
        - env:
            {{- toYaml .Values.extraEnv | nindent 12 }}
          image: {{ include "sable-next.image" . | quote }}
        {{- else }}
        - image: {{ include "sable-next.image" . | quote }}
        {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            {{- toYaml (merge (dict "httpGet" (dict "path" "/health" "port" "http")) (deepCopy .Values.livenessProbe)) | nindent 12 }}
          name: sable-next
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            {{- toYaml (merge (dict "httpGet" (dict "path" "/health" "port" "http")) (deepCopy .Values.readinessProbe)) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            {{- toYaml (merge (dict "httpGet" (dict "path" "/health" "port" "http")) (deepCopy .Values.startupProbe)) | nindent 12 }}
          terminationMessagePolicy: FallbackToLogsOnError
          {{- with $mounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      dnsConfig:
        {{- toYaml .Values.dnsConfig | nindent 8 }}
      enableServiceLinks: false
      hostUsers: {{ .Values.hostUsers }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      restartPolicy: Always
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "sable-next.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- toYaml $spread | nindent 8 }}
      {{- with $volumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
