{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $rpc := dict "ports" (list (dict "port" 9091 "protocol" "TCP")) }}
{{- with $np.rpc.from }}{{ $_ := set $rpc "from" . }}{{ end }}
{{- /* BitTorrent peers can be anyone: the peer port is open to every source. */}}
{{- $peers := dict "ports" (list (dict "port" (int .Values.peer.port) "protocol" "TCP") (dict "port" (int .Values.peer.port) "protocol" "UDP")) }}
{{- $ingress := list $rpc $peers }}
{{- if .Values.metrics.enabled }}
{{- $metrics := dict "ports" (list (dict "port" (int .Values.metrics.port) "protocol" "TCP")) }}
{{- with $np.metrics.from }}{{ $_ := set $metrics "from" . }}{{ end }}
{{- $ingress = append $ingress $metrics }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "transmission.labels" . | nindent 4 }}
  name: {{ include "transmission.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  egress:
    - ports:
        - port: 53
          protocol: TCP
        - port: 53
          protocol: UDP
      {{- with $np.egress.dns.to }}
      to:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    {{- with $np.egress.peers.to }}
    - to:
        {{- toYaml . | nindent 8 }}
    {{- else }}
    - {}
    {{- end }}
    {{- with $np.egress.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
  ingress:
    {{- toYaml $ingress | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "transmission.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
