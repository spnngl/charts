# yaml-language-server: $schema=https://json.schemastore.org/chart.json
apiVersion: v2
name: transmission
description: Transmission BitTorrent daemon and web UI as a hardened single-replica StatefulSet, with an optional Prometheus exporter sidecar
type: application
version: 0.1.0
# renovate: datasource=docker depName=ghcr.io/spnngl/images/transmission
appVersion: "4.1.3"
kubeVersion: ">=1.33.0-0"
home: https://transmissionbt.com
icon: https://raw.githubusercontent.com/transmission/transmission/4.1.3/web/public_html/images/favicon.svg
sources:
  - https://github.com/spnngl/charts
  - https://github.com/transmission/transmission
  - https://github.com/spnngl/images
  - https://github.com/spnngl/transmission-exporter
keywords:
  - transmission
  - bittorrent
  - torrent
maintainers:
  - name: spnngl
    url: https://github.com/spnngl
annotations:
  artifacthub.io/license: GPL-2.0-only OR GPL-3.0-only
  # The pinned digests are the default images (templates/_helpers.tpl,
  # transmission.image): each image takes the entry whose repository it uses.
  # Renovate updates tag and digest together.
  artifacthub.io/images: |
    - name: transmission
      image: ghcr.io/spnngl/images/transmission:4.1.3@sha256:0811b33b08cfe284742a3a4cd9351026482c197a7ace40d70375cd8703ae1772
    - name: transmission-exporter
      image: ghcr.io/spnngl/images/transmission-exporter:0.5.0@sha256:d7207c1863383543f0bbc519dca0a08ea4f7320b8ac1365304630d5650de83a9
  artifacthub.io/links: |-
    - name: Upstream project
      url: https://transmissionbt.com
    - name: Upstream repository
      url: https://github.com/transmission/transmission
    - name: Images repository
      url: https://github.com/spnngl/images
    - name: Exporter repository
      url: https://github.com/spnngl/transmission-exporter
    - name: Chart source
      url: https://github.com/spnngl/charts/tree/main/charts/transmission
    - name: Verify signature and attestations
      url: https://github.com/spnngl/charts#verifying-what-you-install
