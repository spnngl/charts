# Source: ignition-converter/templates/mutatingwebhookconfiguration.yaml
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  annotations:
    # cainjector fills in caBundle with the CA, not the serving certificate.
    cert-manager.io/inject-ca-from: ignition-converter/converter-ca
  labels:
    app.kubernetes.io/instance: ignition-converter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ignition-converter
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: ignition-converter-0.0.0
  # Cluster-scoped: the namespace keeps two releases of one name apart.
  name: converter-ignition-converter
webhooks:
  - admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: converter
        namespace: ignition-converter
        path: /mutate
        port: 443
    # Fail closed: a Secret left in Ignition 2.x would be rejected at boot by
    # Fedora CoreOS, far from the cause.
    failurePolicy: Fail
    matchConditions:
      # Data values are base64 in the API object, so only the key is matched;
      # the webhook checks that format is "ignition".
      - expression: >-
          object.type == 'cluster.x-k8s.io/secret' &&
          has(object.data) && 'format' in object.data
        name: ignition-bootstrap-secret
    matchPolicy: Equivalent
    name: converter.ignition-converter.svc
    namespaceSelector:
      matchLabels:
        example.com/capi: "true"
    # Only Cluster API bootstrap Secrets. This also keeps the webhook's own
    # TLS Secret out of scope, which would otherwise deadlock its startup.
    objectSelector:
      matchExpressions:
        - key: cluster.x-k8s.io/cluster-name
          operator: Exists
    reinvocationPolicy: Never
    rules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - secrets
        scope: Namespaced
    sideEffects: None
    # The webhook's shutdownTimeout (main.go) matches it: a terminating pod
    # answers every review the API server still waits for.
    timeoutSeconds: 10
