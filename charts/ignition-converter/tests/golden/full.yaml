apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: ignition-converter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ignition-converter
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: ignition-converter-0.0.0
  name: converter
  namespace: ignition-converter
spec:
  ingress:
    - from:
      - ipBlock:
          cidr: 10.0.0.0/8
      ports:
      - port: 8443
        protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: ignition-converter
      app.kubernetes.io/name: ignition-converter
  # Egress listed with no rule: every outbound connection is denied. The
  # webhook dials nothing, not even DNS.
  policyTypes:
    - Egress
    - Ingress
