# Source: ignition-converter/templates/certificates.yaml
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  labels:
    app.kubernetes.io/instance: ignition-converter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ignition-converter
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: ignition-converter-0.0.0
  name: converter-ca
  namespace: ignition-converter
spec:
  commonName: converter-ca
  # Ten years. A renewed CA changes caBundle at once: renew the serving
  # certificate right after (README, TLS).
  duration: 87600h
  isCA: true
  issuerRef:
    kind: Issuer
    name: converter-selfsigned
  privateKey:
    algorithm: ECDSA
    size: 256
  secretName: converter-ca
