# Source: ignition-converter/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    ignore-check.kube-linter.io/dnsconfig-options: "The webhook resolves no name: it dials nothing."
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read; a nodeAffinity would be replaced by a user affinity override."
  labels:
    app.kubernetes.io/instance: ignition-converter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ignition-converter
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: ignition-converter-0.0.0
  name: converter
  namespace: ignition-converter
spec:
  minReadySeconds: 5
  replicas: 5
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: ignition-converter
      app.kubernetes.io/name: ignition-converter
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        example.com/note: hello
      labels:
        app.kubernetes.io/instance: ignition-converter
        app.kubernetes.io/managed-by: Helm
        app.kubernetes.io/name: ignition-converter
        app.kubernetes.io/version: 0.0.0
        example.com/team: platform
        helm.sh/chart: ignition-converter-0.0.0
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: ignition-converter
                  app.kubernetes.io/name: ignition-converter
              topologyKey: kubernetes.io/hostname
            weight: 100
      automountServiceAccountToken: false
      containers:
        # Flags are the binary's whole configuration (main.go): it reads no
        # file and no variable besides these.
        - args:
            - --addr=:8443
            - --cert-file=/tls/tls.crt
            - --key-file=/tls/tls.key
          env:
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: GODEBUG
              value: http2debug=1
          image: "ghcr.io/spnngl/images/ignition-converter:0.1.2"
          imagePullPolicy: IfNotPresent
          # The Service keeps routing to a terminating pod until the endpoint
          # removal propagates: keep serving meanwhile, then SIGTERM closes the
          # listener. sleep, not exec: the image has no shell.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          name: ignition-converter
          ports:
            - containerPort: 8443
              name: https
              protocol: TCP
          readinessProbe:
            failureThreshold: 2
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 5
          resizePolicy:
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /tls
              name: tls
              readOnly: true
            - mountPath: /tmp
              name: scratch
      enableServiceLinks: false
      hostUsers: true
      imagePullSecrets:
        - name: ghcr
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-cluster-critical
      restartPolicy: Always
      securityContext:
        fsGroup: 65532
        runAsGroup: 65532
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: converter
      # preStop 5 s + the webhook's 10 s shutdown (shutdownTimeout in main.go,
      # also the webhook timeoutSeconds) + margin.
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: ignition-converter
              app.kubernetes.io/name: ignition-converter
          matchLabelKeys:
          - pod-template-hash
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
      volumes:
        - name: tls
          secret:
            defaultMode: 288 # 0440
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
            secretName: converter-tls
        - emptyDir: {}
          name: scratch
