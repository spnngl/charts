# Source: nftables-exporter/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: nftables-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: nftables-exporter
    app.kubernetes.io/version: 0.0.0
    helm.sh/chart: nftables-exporter-0.0.0
  name: nftx
  namespace: nftables-exporter
spec:
  groups:
    - name: nftx
      rules:
        - alert: NftablesExporterReadFailed
          annotations:
            description: "{{ $labels.namespace }}/{{ $labels.pod }} cannot read the nftables ruleset of its node for 5 minutes: the nftables metrics are missing (check the pod logs: nft path, NET_ADMIN, root)."
            summary: nftables exporter cannot read the node ruleset.
          expr: "nftables_up{job=\"nftables-exporter/nftx\", namespace=\"nftables-exporter\"} == 0"
          for: 5m
          labels:
            severity: warning
