            runAsUser: 0
            seccompProfile:
              type: RuntimeDefault
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /etc/nftables-exporter
              name: config
              readOnly: true
      dnsPolicy: Default
      enableServiceLinks: false
      hostNetwork: true
      imagePullSecrets:
        - name: regcred
      nodeSelector:
        kubernetes.io/os: linux
      priorityClassName: system-node-critical
      restartPolicy: Always
      securityContext:
        runAsGroup: 0
        runAsNonRoot: false
        runAsUser: 0
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: nftx
      terminationGracePeriodSeconds: 5
      tolerations:
