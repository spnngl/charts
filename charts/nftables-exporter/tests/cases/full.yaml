values:
  fullnameOverride: nftx
  metrics:
    port: 9100
    podMonitor:
      enabled: true
    prometheusRule:
      enabled: true
  updateStrategy:
    rollingUpdate:
      maxUnavailable: 25%
  tolerations:
    - operator: Exists
  priorityClassName: system-node-critical
  podAnnotations:
    example.com/note: hello
  podLabels:
    example.com/team: monitoring
  imagePullSecrets:
    - name: regcred
  serviceAccount:
    annotations:
      example.com/note: hello
