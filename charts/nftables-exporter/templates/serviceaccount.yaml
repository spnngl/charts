{{- if .Values.serviceAccount.create }}
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "nftables-exporter.labels" . | nindent 4 }}
  name: {{ include "nftables-exporter.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
