# yaml-language-server: $schema=values.schema.json
# @schema.root
# title: nftables-exporter values
# allOf:
#   # the alert rule selects the `job` label set by the PodMonitor
#   - if:
#       required: [metrics]
#       properties:
#         metrics:
#           required: [prometheusRule]
#           properties:
#             prometheusRule:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#     then:
#       properties:
#         metrics:
#           required: [podMonitor]
#           properties:
#             podMonitor:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#   # Prometheus scrapes the node IP: loopback is unreachable
#   - if:
#       required: [metrics]
#       properties:
#         metrics:
#           required: [podMonitor]
#           properties:
#             podMonitor:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#     then:
#       properties:
#         metrics:
#           properties:
#             bindAddress:
#               not:
#                 const: 127.0.0.1
# @schema.root
# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Override the full resource name (default `<release>-<chart>`).
fullnameOverride: ""

image:
  # -- Image repository.
  repository: ghcr.io/spnngl/images/nftables-exporter
  # -- Image tag. Empty: `appVersion` pinned by the digest recorded in `Chart.yaml`. When set, the chart digest is not applied; add `image.digest` to pin it.
  tag: ""
  # @schema
  # type: string
  # pattern: "^(sha256:[a-f0-9]{64})?$"
  # @schema
  # -- Image digest, only valid together with `image.tag`.
  digest: ""
  # @schema
  # type: string
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
# @schema
# -- Image pull secrets (list of `{name: <secret>}`).
imagePullSecrets: []

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Free-form exporter configuration, rendered as its YAML config file (maps merge with these defaults, lists replace). Unknown keys are ignored by the exporter. `nftables_exporter.bind_to` is chart-owned (see `metrics`) and rejected.
config:
  # @schema
  # type: object
  # additionalProperties: true
  # propertyNames:
  #   not:
  #     const: bind_to
  # @schema
  nftables_exporter:
    # @schema
    # type: string
    # pattern: "^/"
    # @schema
    # -- HTTP path of the metrics (every other path answers 404).
    url_path: /metrics
    # @schema
    # type: string
    # pattern: "^/"
    # @schema
    # -- Path of `nft` in the image. The exporter runs `nft -j -t list ruleset` on every scrape.
    nft_location: /usr/sbin/nft
    # @schema
    # type: string
    # enum: [debug, info, warn, error]
    # @schema
    # -- Log level (JSON logs on stdout).
    log_level: warn
    # fake_nft_json: /path/to/ruleset.json  # read this file instead of running nft (tests only)

metrics:
  # @schema
  # type: integer
  # minimum: 1024
  # maximum: 65535
  # @schema
  # -- Metrics listen port. It is a port of every node (host network): the pod does not schedule on a node where it is taken.
  port: 9630
  # @schema
  # type: string
  # enum: ["", 127.0.0.1, 0.0.0.0]
  # @schema
  # -- Metrics listen address. Empty: `127.0.0.1`, or `0.0.0.0` (every node interface, Prometheus scrapes the node IP) with `podMonitor.enabled`. Set `0.0.0.0` to scrape without the Prometheus Operator. IPv6-only nodes are not supported. The metrics have no authentication: firewall the port from untrusted networks.
  bindAddress: ""
  podMonitor:
    # -- Create a Prometheus Operator PodMonitor. The metrics then listen on every node interface: Prometheus must reach the port on the nodes (cloud firewalls, security groups), firewall it from untrusted networks.
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Extra labels (for example `release: kube-prometheus-stack`).
    labels: {}
    # -- Scrape interval (empty: Prometheus default). Every scrape runs `nft` once.
    interval: ""
    # -- Scrape timeout (empty: Prometheus default).
    scrapeTimeout: ""
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Relabelings.
    relabelings: []
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Metric relabelings, for example to drop `nftables_rule_*`: one series per counted rule, with its comment and addresses as labels.
    metricRelabelings: []
  prometheusRule:
    # -- Create a Prometheus Operator PrometheusRule (alert `NftablesExporterReadFailed`: `nftables_up == 0` for 5 minutes). Needs `podMonitor`: the rule selects the `job` label it sets.
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Extra labels (for example `release: kube-prometheus-stack`).
    labels: {}

updateStrategy:
  # @schema
  # type: string
  # enum: [RollingUpdate, OnDelete]
  # @schema
  # -- DaemonSet update strategy. There is no `maxSurge`: two exporters cannot share the node port.
  type: RollingUpdate
  rollingUpdate:
    # @schema
    # type: [integer, string]
    # @schema
    # -- Nodes updated at once (their metrics are missing for a few seconds).
    maxUnavailable: 1
# @schema
# type: integer
# minimum: 0
# @schema
# -- Seconds a new exporter must be Ready before the next node is updated.
minReadySeconds: 5
# -- Old ControllerRevisions to keep.
revisionHistoryLimit: 3
# @schema
# type: integer
# minimum: 0
# @schema
# -- Termination grace period. The exporter does not handle SIGTERM: it exits at once.
terminationGracePeriodSeconds: 5

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Empty: `<fullname>` (or `default` when `create` is false).
  name: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- ServiceAccount annotations.
  annotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Pod annotations.
podAnnotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Extra pod labels.
podLabels: {}
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Pod security context. Overrides are merged onto these defaults. Root is required: Kubernetes has no ambient capabilities, so only root keeps `NET_ADMIN` in the `nft` child process.
podSecurityContext:
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Container security context. Overrides are merged onto these defaults. `NET_ADMIN` is the only capability, needed to read the node's nftables ruleset. On SELinux nodes that deny `netlink_netfilter_socket`, set `seLinuxOptions: {type: spc_t}`.
securityContext:
  allowPrivilegeEscalation: false
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  capabilities:
    add:
      - NET_ADMIN
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 0
  runAsNonRoot: false
  runAsUser: 0
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Resources. Memory grows with the ruleset size: every scrape runs `nft -j` in the pod's cgroup and parses its JSON output. Concurrent scrapes (an HA Prometheus pair) each run their own `nft`. Measured with one scraper: 512Mi holds 33000 ruleset lines (kube-proxy iptables mode, 3000 services with one endpoint each), 256Mi does not; kube-proxy nftables mode needs far less (16 MiB for 3000 services). Size it to `nft list ruleset | wc -l` on your largest node. No CPU limit on purpose. Like the other maps, `limits` and `requests` merge with these defaults: set a key to `null` to drop it.
resources:
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  limits:
    memory: 512Mi
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  requests:
    cpu: 10m
    memory: 32Mi

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Readiness probe: the metrics port accepts connections. TCP on purpose: `/metrics` runs `nft` and answers 200 even when it fails (see `nftables_up`). The chart sets `tcpSocket.host` to `metrics.bindAddress` unless it is `0.0.0.0`. No liveness probe: the exporter exits when it cannot listen, and no check can tell a hung process.
readinessProbe:
  failureThreshold: 1
  periodSeconds: 2
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  tcpSocket:
    port: metrics

# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Node selector. Merged with the default `kubernetes.io/os: linux`: set that key to `null` to drop it.
nodeSelector:
  kubernetes.io/os: linux
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Tolerations. None by default: tainted nodes (control plane) are skipped. Uncomment `operator: Exists` to run on every node.
tolerations: []
# - operator: Exists
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Affinity.
affinity: {}
# -- Priority class name.
priorityClassName: ""
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
#   additionalProperties: true
# @schema
# -- Extra environment variables (list of `EnvVar`). The exporter reads none: only the Go runtime ones apply (`GOMEMLIMIT`, `GODEBUG`, ...).
extraEnv: []
# @schema
# type: array
# items:
#   type: string
#   minLength: 1
# @schema
# -- Extra exporter command-line arguments, placed after `--config <file>`. The exporter has no other option than `--version` (prints and exits): settings belong in `config`.
extraArgs: []
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Extra volumes (for example a ruleset JSON for `config.nftables_exporter.fake_nft_json`).
extraVolumes: []
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Extra volume mounts for the exporter container.
extraVolumeMounts: []
