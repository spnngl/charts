{{- if .Values.ingress.enabled }}
{{- $fullname := include "tuwunel.fullname" . }}
{{- $backend := dict "service" (dict "name" $fullname "port" (dict "name" "http")) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- toYaml (merge (include "tuwunel.labels" (dict "ctx" . "component" "homeserver") | fromYaml) (deepCopy .Values.ingress.labels)) | nindent 4 }}
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - backend:
              {{- toYaml $backend | nindent 14 }}
            path: /
            pathType: Prefix
    {{- end }}
    {{- /* A serverName that is also a host is already served in full. */}}
    {{- if and .Values.ingress.wellKnown (not (has .Values.serverName .Values.ingress.hosts)) }}
    - host: {{ .Values.serverName | quote }}
      http:
        paths:
          - backend:
              {{- toYaml $backend | nindent 14 }}
            path: /.well-known/matrix
            pathType: Prefix
    {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
