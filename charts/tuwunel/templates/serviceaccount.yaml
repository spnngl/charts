{{- if .Values.serviceAccount.create }}
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "homeserver") | nindent 4 }}
  name: {{ include "tuwunel.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
{{- end }}
