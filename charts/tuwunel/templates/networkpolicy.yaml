{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $homeserver := dict "ports" (list (dict "port" 8008 "protocol" "TCP")) }}
{{- with $np.homeserver.from }}{{ $_ := set $homeserver "from" . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "homeserver") | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  egress:
    {{- include "tuwunel.egress" . | nindent 4 }}
  {{- end }}
  ingress:
    {{- toYaml (list $homeserver) | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" (dict "ctx" . "component" "homeserver") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- if .Values.cinny.enabled }}
{{- $cinny := dict "ports" (list (dict "port" 8080 "protocol" "TCP")) }}
{{- with $np.cinny.from }}{{ $_ := set $cinny "from" . }}{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "cinny") | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}-cinny
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  {{- /* A static file server reaches nothing: the browser talks to the homeserver. */}}
  egress: []
  {{- end }}
  ingress:
    {{- toYaml (list $cinny) | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" (dict "ctx" . "component" "cinny") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
{{- if .Values.livekit.enabled }}
{{- $l := .Values.livekit }}
{{- if ne $l.rtc.mode "hostNetwork" }}
{{- $http := dict "ports" (list (dict "port" 7880 "protocol" "TCP")) }}
{{- with $np.livekit.from }}{{ $_ := set $http "from" . }}{{ end }}
{{- $media := list (dict "port" $l.rtc.tcpPort "protocol" "TCP") (dict "port" $l.rtc.udpPort "protocol" "UDP") }}
{{- if $l.turn.enabled }}
{{- $media = append $media (dict "port" 3478 "protocol" "UDP") }}
{{- if $l.turn.existingSecret.name }}
{{- $media = append $media (dict "port" 5349 "protocol" "TCP") }}
{{- end }}
{{- end }}
{{- $rules := list $http (dict "ports" $media) }}
{{- if $l.metrics.enabled }}
{{- $metrics := dict "ports" (list (dict "port" 6789 "protocol" "TCP")) }}
{{- with $np.livekit.metrics.from }}{{ $_ := set $metrics "from" . }}{{ end }}
{{- $rules = append $rules $metrics }}
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "livekit") | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}-livekit
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  egress:
    {{- include "tuwunel.egress" . | nindent 4 }}
  {{- end }}
  ingress:
    {{- toYaml $rules | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" (dict "ctx" . "component" "livekit") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
{{- $jwt := dict "ports" (list (dict "port" 8080 "protocol" "TCP")) }}
{{- with $np.livekit.jwt.from }}{{ $_ := set $jwt "from" . }}{{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "lk-jwt") | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}-lk-jwt
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  egress:
    {{- include "tuwunel.egress" . | nindent 4 }}
  {{- end }}
  ingress:
    {{- toYaml (list $jwt) | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" (dict "ctx" . "component" "lk-jwt") | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
{{- end }}
