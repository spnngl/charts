{{- if and .Values.livekit.enabled .Values.livekit.metrics.podMonitor.enabled }}
{{- $m := .Values.livekit.metrics.podMonitor }}
{{- $endpoint := dict "path" "/metrics" "port" "metrics" }}
{{- with $m.interval }}{{ $_ := set $endpoint "interval" . }}{{ end }}
{{- with $m.scrapeTimeout }}{{ $_ := set $endpoint "scrapeTimeout" . }}{{ end }}
{{- with $m.relabelings }}{{ $_ := set $endpoint "relabelings" . }}{{ end }}
{{- with $m.metricRelabelings }}{{ $_ := set $endpoint "metricRelabelings" . }}{{ end }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    {{- toYaml (merge (include "tuwunel.labels" (dict "ctx" . "component" "livekit") | fromYaml) (deepCopy $m.labels)) | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}-livekit
  namespace: {{ .Release.Namespace }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  podMetricsEndpoints:
    {{- toYaml (list $endpoint) | nindent 4 }}
  selector:
    matchLabels:
      {{- include "tuwunel.selectorLabels" (dict "ctx" . "component" "livekit") | nindent 6 }}
{{- end }}
