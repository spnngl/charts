{{- if and .Values.livekit.enabled (eq .Values.livekit.rtc.mode "LoadBalancer") }}
{{- $s := .Values.livekit.rtc.service }}
apiVersion: v1
kind: Service
metadata:
  annotations:
    {{- toYaml (merge (deepCopy $s.annotations) (dict "ignore-check.kube-linter.io/exposed-services" "livekit.rtc.mode is LoadBalancer: media must reach LiveKit from the internet.")) | nindent 4 }}
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "livekit") | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}-livekit-rtc
  namespace: {{ .Release.Namespace }}
spec:
  {{- with $s.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  {{- with $s.loadBalancerClass }}
  loadBalancerClass: {{ . }}
  {{- end }}
  ports:
    - name: rtc-tcp
      port: {{ .Values.livekit.rtc.tcpPort }}
      protocol: TCP
      targetPort: rtc-tcp
    - name: rtc-udp
      port: {{ .Values.livekit.rtc.udpPort }}
      protocol: UDP
      targetPort: rtc-udp
    {{- if .Values.livekit.turn.enabled }}
    - name: turn-udp
      port: 3478
      protocol: UDP
      targetPort: turn-udp
    {{- if .Values.livekit.turn.existingSecret.name }}
    {{- /* Clients always dial turns:<domain>:443 (LiveKit pkg/service/roommanager.go). */}}
    - name: turn-tls
      port: 443
      protocol: TCP
      targetPort: turn-tls
    {{- end }}
    {{- end }}
  selector:
    {{- include "tuwunel.selectorLabels" (dict "ctx" . "component" "livekit") | nindent 4 }}
  type: LoadBalancer
{{- end }}
