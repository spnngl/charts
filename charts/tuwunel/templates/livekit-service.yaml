{{- if .Values.livekit.enabled }}
apiVersion: v1
kind: Service
metadata:
  {{- with .Values.livekit.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "livekit") | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}-livekit
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http
      port: 7880
      protocol: TCP
      targetPort: http
    {{- if and .Values.livekit.turn.enabled .Values.livekit.turn.existingSecret.name }}
    {{- /* For an ingress controller passing turn.domain:443 through (SSL passthrough). */}}
    - name: turn-tls
      port: 5349
      protocol: TCP
      targetPort: turn-tls
    {{- end }}
  selector:
    {{- include "tuwunel.selectorLabels" (dict "ctx" . "component" "livekit") | nindent 4 }}
  type: ClusterIP
{{- end }}
