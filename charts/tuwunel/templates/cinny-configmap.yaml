{{- if .Values.cinny.enabled }}
apiVersion: v1
data:
  config.json: |
    {{- include "tuwunel.cinnyConfig" . | nindent 4 }}
kind: ConfigMap
metadata:
  labels:
    {{- include "tuwunel.labels" (dict "ctx" . "component" "cinny") | nindent 4 }}
  name: {{ include "tuwunel.fullname" . }}-cinny
  namespace: {{ .Release.Namespace }}
{{- end }}
