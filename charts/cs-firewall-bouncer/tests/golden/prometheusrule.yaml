# Source: cs-firewall-bouncer/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: cs-firewall-bouncer
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: cs-firewall-bouncer
    app.kubernetes.io/version: 0.0.38
    helm.sh/chart: cs-firewall-bouncer-0.1.0
    release: kube-prometheus-stack
  name: cs-firewall-bouncer
  namespace: cs-firewall-bouncer
spec:
  groups:
    - name: cs-firewall-bouncer
      rules:
        - alert: CSFirewallBouncerNotReady
          annotations:
            description: "{{ $value }} node(s) running cs-firewall-bouncer/cs-firewall-bouncer have had no ready bouncer for 15 minutes: they are not protected (or not up to date)."
            summary: CrowdSec firewall bouncer is not ready on some nodes.
          expr: "kube_daemonset_status_desired_number_scheduled{namespace=\"cs-firewall-bouncer\", daemonset=\"cs-firewall-bouncer\"} - kube_daemonset_status_number_ready{namespace=\"cs-firewall-bouncer\", daemonset=\"cs-firewall-bouncer\"} > 0"
          for: 15m
          labels:
            severity: critical
        - alert: CSFirewallBouncerLapiErrors
          annotations:
            description: "{{ $value | humanizePercentage }} of the LAPI calls of {{ $labels.namespace }}/{{ $labels.pod }} failed for 15 minutes: its node gets no new decision (check the LAPI URL, the API key and the network)."
            summary: CrowdSec firewall bouncer cannot reach the LAPI.
          expr: "sum by (namespace, pod) (rate(lapi_requests_failures_total{job=\"cs-firewall-bouncer/cs-firewall-bouncer\", namespace=\"cs-firewall-bouncer\"}[5m])) / sum by (namespace, pod) (rate(lapi_requests_total{job=\"cs-firewall-bouncer/cs-firewall-bouncer\", namespace=\"cs-firewall-bouncer\"}[5m])) > 0.2"
          for: 15m
          labels:
            severity: warning
