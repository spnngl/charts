              name: runtime-registries
              readOnly: false
            - mountPath: /etc/containers/certs.d
              name: runtime-certs
              readOnly: false
            - mountPath: /var/lib/containers/storage/overlay-images
              name: runtime-images
              readOnly: true
      dnsPolicy: ClusterFirst
