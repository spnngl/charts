apiVersion: v1
kind: Service
metadata:
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- toYaml (merge (include "ghcr-exporter.labels" . | fromYaml) (deepCopy .Values.service.labels)) | nindent 4 }}
  name: {{ include "ghcr-exporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  ports:
    - name: http-metrics
      port: 8080
      protocol: TCP
      targetPort: http-metrics
  selector:
    {{- include "ghcr-exporter.selectorLabels" . | nindent 4 }}
  type: ClusterIP
