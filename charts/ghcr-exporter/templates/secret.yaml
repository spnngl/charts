{{- with .Values.github.token }}
apiVersion: v1
kind: Secret
metadata:
  labels:
    {{- include "ghcr-exporter.labels" $ | nindent 4 }}
  name: {{ include "ghcr-exporter.fullname" $ }}
  namespace: {{ $.Release.Namespace }}
stringData:
  {{ $.Values.github.existingSecret.key }}: {{ . | quote }}
type: Opaque
{{- end }}
