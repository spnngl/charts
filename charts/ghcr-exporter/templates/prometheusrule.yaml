{{- if .Values.metrics.prometheusRule.enabled }}
{{- $m := .Values.metrics.prometheusRule }}
{{- $fullname := include "ghcr-exporter.fullname" . }}
{{- /* job label set by the Prometheus Operator: Service name (ServiceMonitor) or <namespace>/<name> (PodMonitor). */}}
{{- $job := ternary $fullname (printf "%s/%s" .Release.Namespace $fullname) .Values.metrics.serviceMonitor.enabled }}
{{- $sel := printf "job=%q, namespace=%q" $job .Release.Namespace }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    {{- toYaml (merge (include "ghcr-exporter.labels" . | fromYaml) (deepCopy $m.labels)) | nindent 4 }}
  name: {{ $fullname }}
  namespace: {{ .Release.Namespace }}
spec:
  groups:
    - name: {{ $fullname }}
      rules:
        {{- if not (has "GhcrExporterDown" $m.disabled) }}
        - alert: GhcrExporterDown
          annotations:
            description: {{ printf "No ghcr-exporter target of %s/%s has been up for 10 minutes (pod not running or not scraped; also fires when replicaCount is 0)." .Release.Namespace $fullname | quote }}
            summary: ghcr-exporter is down.
          expr: {{ printf "absent(up{%s} == 1)" $sel | quote }}
          for: 10m
          labels:
            severity: critical
        {{- end }}
        {{- if not (has "GhcrExporterCollectionFailing" $m.disabled) }}
        - alert: GhcrExporterCollectionFailing
          annotations:
            description: {{ printf "Collections of %s keep failing on %s for 30 minutes: check the logs (invalid or expired token, missing read:packages scope, GitHub rate limit)." "{{ $labels.repo }}" "{{ $labels.namespace }}/{{ $labels.pod }}" | quote }}
            summary: ghcr-exporter cannot collect GHCR data.
          expr: {{ printf "increase(ghcr_collection_failed_total{%s}[30m]) > 0" $sel | quote }}
          for: 30m
          labels:
            severity: warning
        {{- end }}
        {{- if not (has "GhcrExporterCollectionStale" $m.disabled) }}
        - alert: GhcrExporterCollectionStale
          annotations:
            description: {{ printf "No successful collection of %s for more than %v intervals on %s." "{{ $labels.repo }}" $m.staleIntervals "{{ $labels.namespace }}/{{ $labels.pod }}" | quote }}
            summary: ghcr-exporter metrics are stale.
          expr: {{ printf "time() - ghcr_collection_timestamp{%s} > %v * ghcr_collection_interval_seconds{%s}" $sel $m.staleIntervals $sel | quote }}
          for: 15m
          labels:
            severity: warning
        {{- end }}
        {{- if not (has "GhcrExporterDownloadsUnknown" $m.disabled) }}
        - alert: GhcrExporterDownloadsUnknown
          annotations:
            description: {{ printf "The download count of %s/%s could not be read from its package page on github.com for 1 hour on %s (ghcr_package_downloads is -1): page unreachable, HTTP 429, or a GitHub page layout the exporter no longer parses." "{{ $labels.owner }}" "{{ $labels.repo }}" "{{ $labels.namespace }}/{{ $labels.pod }}" | quote }}
            summary: ghcr-exporter cannot read download counts.
          expr: {{ printf "ghcr_package_downloads{%s} < 0" $sel | quote }}
          for: 1h
          labels:
            severity: warning
        {{- end }}
{{- end }}
