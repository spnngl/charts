# Source: ghcr-exporter/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: ghcr-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: ghcr-exporter
    app.kubernetes.io/version: 0.0.0
    helm.sh/chart: ghcr-exporter-0.0.0
    release: kube-prometheus-stack
  name: ghcr-exporter
  namespace: ghcr-exporter
spec:
  groups:
    - name: ghcr-exporter
      rules:
        - alert: GhcrExporterDown
          annotations:
            description: "No ghcr-exporter target of ghcr-exporter/ghcr-exporter has been up for 10 minutes (pod not running or not scraped; also fires when replicaCount is 0)."
            summary: ghcr-exporter is down.
          expr: "absent(up{job=\"ghcr-exporter\", namespace=\"ghcr-exporter\"} == 1)"
          for: 10m
          labels:
            severity: critical
        - alert: GhcrExporterCollectionFailing
          annotations:
            description: "Collections of {{ $labels.repo }} keep failing on {{ $labels.namespace }}/{{ $labels.pod }} for 30 minutes: check the logs (invalid or expired token, missing read:packages scope, GitHub rate limit)."
            summary: ghcr-exporter cannot collect GHCR data.
          expr: "increase(ghcr_collection_failed_total{job=\"ghcr-exporter\", namespace=\"ghcr-exporter\"}[30m]) > 0"
          for: 30m
          labels:
            severity: warning
