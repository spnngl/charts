        app.kubernetes.io/name: ghcr-exporter
        app.kubernetes.io/version: 0.0.0
        example.com/team: platform
        helm.sh/chart: ghcr-exporter-0.0.0
    spec:
      automountServiceAccountToken: false
      containers:
        - args:
            - -config
            - /etc/ghcr-exporter/config.yaml
          command:
            - /app/ghcr-exporter
          env:
            - name: GHCR_EXPORTER_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  key: token
                  name: ghcr-exporter
            - name: GHCR_EXPORTER_LOG_FORMAT
              value: "text"
            - name: GHCR_EXPORTER_LOG_LEVEL
              value: "debug"
            - name: GHCR_EXPORTER_METRICS_COLLECTION_DEFAULT_INTERVAL
              value: "300s"
            - name: GHCR_EXPORTER_SERVER_HOST
              value: 0.0.0.0
            - name: GHCR_EXPORTER_SERVER_PORT
              value: "8080"
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  resource: limits.memory
            - name: TRACING_ENABLED
              value: "true"
          image: "ghcr.io/d0ugal/ghcr-exporter:v2.13.65"
          imagePullPolicy: IfNotPresent
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /health
              port: http-metrics
            periodSeconds: 30
          name: ghcr-exporter
          ports:
            - containerPort: 8080
              name: http-metrics
              protocol: TCP
          readinessProbe:
            failureThreshold: 1
            httpGet:
              path: /health
              port: http-metrics
            periodSeconds: 30
          resizePolicy:
            - resourceName: memory
              restartPolicy: RestartContainer
          resources:
            limits:
              memory: 128Mi
            requests:
              cpu: 10m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            privileged: false
            readOnlyRootFilesystem: true
            runAsGroup: 1001
            runAsNonRoot: true
            runAsUser: 1001
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            failureThreshold: 30
            httpGet:
              path: /health
              port: http-metrics
            periodSeconds: 2
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
