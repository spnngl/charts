        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: ghcr-exporter
      terminationGracePeriodSeconds: 35
      volumes:
