  selector:
    matchLabels:
      app.kubernetes.io/instance: github-exporter
      app.kubernetes.io/name: github-exporter
---
# Source: github-exporter/templates/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  labels:
    app.kubernetes.io/instance: github-exporter
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: github-exporter
    app.kubernetes.io/version: 0.0.0
    helm.sh/chart: github-exporter-0.0.0
  name: github-exporter
  namespace: github-exporter
spec:
  groups:
    - name: github-exporter
      rules:
        - alert: GitHubExporterDown
          annotations:
            description: "No github-exporter target of github-exporter/github-exporter has been up for 5m (pod not running or not scraped; also fires when replicaCount is 0)."
            summary: github-exporter is down.
          expr: "absent(up{job=\"github-exporter/github-exporter\", namespace=\"github-exporter\"} == 1)"
          for: 5m
          labels:
            severity: critical
        - alert: GitHubExporterAPIErrors
          annotations:
            description: "github-exporter on {{ $labels.namespace }}/{{ $labels.pod }} got GitHub API errors ({{ $labels.endpoint }}, {{ $labels.error_type }}) for 15m: check the logs (invalid or expired token, missing scopes, rate limit). Search API errors are excluded."
            summary: github-exporter cannot collect GitHub data.
          expr: "sum by (namespace, pod, endpoint, error_type) (increase(github_api_errors_total{job=\"github-exporter/github-exporter\", namespace=\"github-exporter\", endpoint!=\"search_issues\"}[15m])) > 0"
          for: 15m
          labels:
            severity: warning
