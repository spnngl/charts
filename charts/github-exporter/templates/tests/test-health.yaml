{{- /* Nothing to dial without a pod (replicaCount 0, as in ct install) or a Service. */}}
{{- if and (gt (int .Values.replicaCount) 0) (include "github-exporter.metricsService" .) }}
apiVersion: v1
kind: Pod
metadata:
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    ignore-check.kube-linter.io/no-liveness-probe: "One-shot hook pod that exits within seconds."
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    ignore-check.kube-linter.io/no-readiness-probe: "One-shot hook pod that exits within seconds."
    ignore-check.kube-linter.io/non-isolated-pod: "Short-lived test pod that only dials the Service."
    ignore-check.kube-linter.io/restart-policy: "Never makes a failing helm test fail fast instead of retrying until the timeout."
  labels:
    {{- toYaml (merge (dict "app.kubernetes.io/component" "test" "app.kubernetes.io/name" (printf "%s-test" (include "github-exporter.name" .))) (include "github-exporter.labels" . | fromYaml)) | nindent 4 }}
  name: {{ include "github-exporter.fullname" . }}-test-health
  namespace: {{ .Release.Namespace }}
spec:
  automountServiceAccountToken: false
  containers:
    - args:
        - -q
        - -O
        - /dev/null
        - {{ printf "http://%s:8080/health" (include "github-exporter.metricsServiceName" .) | quote }}
      command:
        - wget
      image: {{ include "github-exporter.image" . | quote }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      name: health
      resources:
        {{- toYaml .Values.resources | nindent 8 }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
  dnsConfig:
    {{- toYaml .Values.dnsConfig | nindent 4 }}
  enableServiceLinks: false
  hostUsers: {{ .Values.hostUsers }}
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  restartPolicy: Never
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
{{- end }}
