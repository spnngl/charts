{{- if .Values.networkPolicy.enabled }}
{{- $np := .Values.networkPolicy }}
{{- $http := dict "ports" (list (dict "port" 8080 "protocol" "TCP")) }}
{{- with $np.http.from }}{{ $_ := set $http "from" . }}{{ end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    {{- include "cinny.labels" . | nindent 4 }}
  name: {{ include "cinny.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  {{- if $np.egress.enabled }}
  {{- with $np.egress.extraEgress }}
  egress:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- end }}
  ingress:
    {{- toYaml (list $http) | nindent 4 }}
  podSelector:
    matchLabels:
      {{- include "cinny.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    {{- if $np.egress.enabled }}
    - Egress
    {{- end }}
{{- end }}
