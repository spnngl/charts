{{- $env := list (dict "name" "SERVER_GRACE_PERIOD" "value" (toString .Values.gracePeriodSeconds)) }}
{{- if .Values.metrics.enabled }}
{{- $env = append $env (dict "name" "SERVER_METRICS" "value" "true") }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    ignore-check.kube-linter.io/dnsconfig-options: "The server resolves no name: it serves local files and opens no connection."
    {{- if .Values.autoscaling.enabled }}
    ignore-check.kube-linter.io/minimum-three-replicas: "The HPA owns the replica count; hpa-minimum-three-replicas checks its minReplicas."
    {{- else }}
    ignore-check.kube-linter.io/minimum-three-replicas: "Cinny is a stateless static server: two replicas keep a rolling update gap-free."
    {{- end }}
    ignore-check.kube-linter.io/no-node-affinity: "The OS constraint is in nodeSelector, which the check does not read."
    {{- if not .Values.networkPolicy.enabled }}
    ignore-check.kube-linter.io/non-isolated-pod: "networkPolicy.enabled is false: isolation is the user's choice."
    {{- end }}
  labels:
    {{- include "cinny.labels" . | nindent 4 }}
  name: {{ include "cinny.fullname" . }}
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: {{ .Values.minReadySeconds }}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "cinny.selectorLabels" . | nindent 6 }}
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      annotations:
        {{- toYaml (merge (dict "checksum/config" (include (print $.Template.BasePath "/configmap.yaml") . | sha256sum)) (deepCopy .Values.podAnnotations)) | nindent 8 }}
      labels:
        {{- toYaml (merge (include "cinny.labels" . | fromYaml) (deepCopy .Values.podLabels)) | nindent 8 }}
    spec:
      affinity:
        {{- include "cinny.affinity" . | nindent 8 }}
      automountServiceAccountToken: false
      containers:
        - env:
            {{- toYaml (concat $env .Values.extraEnv) | nindent 12 }}
          image: {{ include "cinny.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          livenessProbe:
            {{- toYaml (merge (dict "httpGet" (dict "path" "/health" "port" "http")) (deepCopy .Values.livenessProbe)) | nindent 12 }}
          name: cinny
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          readinessProbe:
            {{- toYaml (merge (dict "httpGet" (dict "path" "/health" "port" "http")) (deepCopy .Values.readinessProbe)) | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          startupProbe:
            {{- toYaml (merge (dict "httpGet" (dict "path" "/health" "port" "http")) (deepCopy .Values.startupProbe)) | nindent 12 }}
          terminationMessagePolicy: FallbackToLogsOnError
          volumeMounts:
            - mountPath: /app/config.json
              name: config
              readOnly: true
              subPath: config.json
      enableServiceLinks: false
      hostUsers: {{ .Values.hostUsers }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      restartPolicy: Always
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      serviceAccountName: {{ include "cinny.serviceAccountName" . }}
      terminationGracePeriodSeconds: {{ add .Values.gracePeriodSeconds 10 }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      topologySpreadConstraints:
        {{- include "cinny.topologySpreadConstraints" . | nindent 8 }}
      volumes:
        - configMap:
            name: {{ include "cinny.fullname" . }}
          name: config
