# yaml-language-server: $schema=https://json.schemastore.org/chart.json
apiVersion: v2
name: cinny
description: Cinny, a Matrix web client, as a hardened stateless Deployment serving its static app
type: application
version: 0.1.0
# renovate: datasource=docker depName=ghcr.io/spnngl/images/cinny
appVersion: "4.12.7"
kubeVersion: ">=1.33.0-0"
home: https://github.com/cinnyapp/cinny
icon: https://raw.githubusercontent.com/cinnyapp/cinny/v4.12.7/public/res/svg/cinny.svg
sources:
  - https://github.com/spnngl/charts
  - https://github.com/cinnyapp/cinny
  - https://github.com/spnngl/images
keywords:
  - cinny
  - matrix
  - chat
  - web-client
maintainers:
  - name: spnngl
    url: https://github.com/spnngl
annotations:
  artifacthub.io/license: AGPL-3.0-only
  # The pinned digest is the default image (templates/_helpers.tpl,
  # cinny.image). Renovate updates tag and digest together.
  artifacthub.io/images: |
    - name: cinny
      image: ghcr.io/spnngl/images/cinny:4.12.7@sha256:ea188a763edc18fd58f4ca02eaf7aef2019bfe1c90ea255449d8446130583c8f
  artifacthub.io/links: |-
    - name: Upstream repository
      url: https://github.com/cinnyapp/cinny
    - name: Images repository
      url: https://github.com/spnngl/images
    - name: Chart source
      url: https://github.com/spnngl/charts/tree/main/charts/cinny
    - name: Verify signature and attestations
      url: https://github.com/spnngl/charts#verifying-what-you-install
