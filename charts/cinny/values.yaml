# yaml-language-server: $schema=values.schema.json
# @schema.root
# title: cinny values
# allOf:
#   # a ServiceMonitor and a PodMonitor would scrape every replica twice
#   - not:
#       required: [metrics]
#       properties:
#         metrics:
#           required: [serviceMonitor, podMonitor]
#           properties:
#             serviceMonitor:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#             podMonitor:
#               required: [enabled]
#               properties:
#                 enabled:
#                   const: true
#   # a monitor scrapes /metrics, which answers only with metrics.enabled
#   - if:
#       required: [metrics]
#       properties:
#         metrics:
#           anyOf:
#             - required: [serviceMonitor]
#               properties:
#                 serviceMonitor:
#                   required: [enabled]
#                   properties:
#                     enabled:
#                       const: true
#             - required: [podMonitor]
#               properties:
#                 podMonitor:
#                   required: [enabled]
#                   properties:
#                     enabled:
#                       const: true
#     then:
#       properties:
#         metrics:
#           required: [enabled]
#           properties:
#             enabled:
#               const: true
# @schema.root
# -- Override the chart name used in resource names and labels.
nameOverride: ""
# -- Override the full resource name (default `<release>-<chart>`).
fullnameOverride: ""

image:
  # -- Image repository.
  repository: ghcr.io/spnngl/images/cinny
  # -- Image tag. Empty: the tag and digest recorded for `image.repository` in the `artifacthub.io/images` annotation of `Chart.yaml`. When set, the chart digest is not applied; add `image.digest` to pin it.
  tag: ""
  # @schema
  # type: string
  # pattern: "^(sha256:[a-f0-9]{64})?$"
  # @schema
  # -- Image digest, only valid together with `image.tag`.
  digest: ""
  # @schema
  # type: string
  # enum: [Always, IfNotPresent, Never]
  # @schema
  # -- Image pull policy.
  pullPolicy: IfNotPresent
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
# @schema
# -- Image pull secrets (list of `{name: <secret>}`).
imagePullSecrets: []

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Cinny `config.json`, served to the browser as is (keep secrets out). Keys read by Cinny: `defaultHomeserver` (index in `homeserverList`), `homeserverList`, `allowCustomHomeservers`, `featuredCommunities` (`openAsDefault`, `spaces`, `rooms`, `servers`), `hashRouter` (`enabled`, `basename`). `homeserverList` entries are server names or `https://` URLs: Cinny reads `/.well-known/matrix/client` there (CORS needed) for the homeserver URL, and uses `https://<name>` (or the URL) itself when that file is missing or unreachable. Maps merge with these defaults, lists replace them; set a key to `null` to drop it.
config:
  allowCustomHomeservers: true
  defaultHomeserver: 0
  homeserverList:
    - matrix.org

# @schema
# type: integer
# minimum: 0
# maximum: 255
# @schema
# -- Seconds the server keeps serving after SIGTERM (`SERVER_GRACE_PERIOD`), while Services and proxies stop sending it traffic; then it drains open requests. `terminationGracePeriodSeconds` is this plus 10.
gracePeriodSeconds: 5

service:
  # @schema
  # type: string
  # enum: [ClusterIP, LoadBalancer, NodePort]
  # @schema
  # -- Service type.
  type: ClusterIP
  # @schema
  # type: integer
  # minimum: 1
  # maximum: 65535
  # @schema
  # -- Service port (the container listens on 8080).
  port: 8080
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Service annotations.
  annotations: {}

ingress:
  # -- Create an Ingress (path `/`: Cinny is built for the root path, it cannot be served under a prefix).
  enabled: false
  # -- Ingress class name (empty: cluster default).
  className: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Ingress annotations.
  annotations: {}
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Extra Ingress labels (for example the label an external-dns `--label-filter` selects).
  labels: {}
  # @schema
  # type: array
  # items:
  #   type: string
  #   minLength: 1
  # @schema
  # -- Host names. Required when enabled.
  hosts: []
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Ingress TLS blocks (`secretName`, `hosts`).
  tls: []

httpRoute:
  # -- Create a Gateway API HTTPRoute (path prefix `/`: Cinny cannot be served under a prefix).
  enabled: false
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- HTTPRoute annotations.
  annotations: {}
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- Extra HTTPRoute labels.
  labels: {}
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Gateways (`parentRefs`). Required when enabled.
  parentRefs: []
  # @schema
  # type: array
  # items:
  #   type: string
  #   minLength: 1
  # @schema
  # -- Host names (empty: any host of the Gateway listener).
  hostnames: []

# @schema
# type: integer
# minimum: 0
# @schema
# -- Replicas (ignored with `autoscaling.enabled`). Cinny is stateless: two keep a rolling update gap-free (`podDisruptionBudget` does the same for node drains). `0` stops the app.
replicaCount: 2
# @schema
# type: integer
# minimum: 0
# @schema
# -- Seconds a new pod must be ready before it counts as available, so a rolling update replaces the next pod only once the new one is serving.
minReadySeconds: 10
# @schema
# type: integer
# minimum: 0
# @schema
# -- Old ReplicaSets to keep.
revisionHistoryLimit: 3

serviceAccount:
  # -- Create the ServiceAccount.
  create: true
  # -- ServiceAccount name. Empty: `<fullname>` (or `default` when `create` is false).
  name: ""
  # @schema
  # type: object
  # additionalProperties:
  #   type: string
  # @schema
  # -- ServiceAccount annotations.
  annotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Pod annotations.
podAnnotations: {}
# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Extra pod labels.
podLabels: {}
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Pod security context. Overrides are merged onto these defaults.
podSecurityContext:
  fsGroup: 65532
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Container security context. Overrides are merged onto these defaults.
securityContext:
  allowPrivilegeEscalation: false
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  capabilities:
    drop:
      - ALL
  privileged: false
  readOnlyRootFilesystem: true
  runAsGroup: 65532
  runAsNonRoot: true
  runAsUser: 65532
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  seccompProfile:
    type: RuntimeDefault
# @schema
# type: boolean
# @schema
# -- Run the pod in a user namespace (`false`: uid 65532 maps to an unprivileged host uid). Needs node support (containerd 2.0+ or CRI-O, runc 1.2+, kernel 6.3+); pods fail to start otherwise. `true` uses host users.
hostUsers: false
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Resources. A scheduling floor, not a sizing (VPA in `Off` mode gives recommendations). No CPU limit on purpose.
resources:
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  limits:
    memory: 64Mi
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  requests:
    cpu: 10m
    memory: 16Mi

# @schema
# type: object
# additionalProperties: true
# @schema
# -- Startup probe (`GET /health`; the handler is fixed, set timings only).
startupProbe:
  failureThreshold: 30
  periodSeconds: 2
  timeoutSeconds: 2
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Readiness probe (`GET /health`; the handler is fixed, set timings only).
readinessProbe:
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 2
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Liveness probe (`GET /health`; the handler is fixed, set timings only).
livenessProbe:
  failureThreshold: 3
  periodSeconds: 10
  timeoutSeconds: 2

# @schema
# type: object
# additionalProperties:
#   type: string
# @schema
# -- Node selector.
nodeSelector:
  kubernetes.io/os: linux
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Tolerations.
tolerations: []
# @schema
# type: object
# additionalProperties: true
# @schema
# -- Affinity, merged over the chart default: a preferred pod anti-affinity that spreads the replicas over nodes (set `podAntiAffinity` to replace it).
affinity: {}
# @schema
# type: array
# items:
#   type: object
# @schema
# -- Topology spread constraints. Empty: the chart spreads the replicas over zones (`topology.kubernetes.io/zone`, `ScheduleAnyway`). A list you set replaces it and needs its own `labelSelector`.
topologySpreadConstraints: []
# -- Priority class name.
priorityClassName: ""
# @schema
# type: array
# items:
#   type: object
#   required: [name]
#   properties:
#     name:
#       type: string
#       minLength: 1
#       not:
#         enum: [SERVER_FALLBACK_PAGE, SERVER_GRACE_PERIOD, SERVER_HEALTH, SERVER_HTTP2_TLS, SERVER_LISTEN_FD, SERVER_METRICS, SERVER_PORT, SERVER_ROOT, SERVER_SECURITY_HEADERS]
# @schema
# -- Extra environment variables (`EnvVar` list), for the other static-web-server `SERVER_*` settings. Rejected names: those the chart sets (use `gracePeriodSeconds` and `metrics.enabled`); the port, listening socket, health endpoint, root and fallback page, which the probes, Service, NetworkPolicy and `config.json` mount rely on; security headers and HTTP/2 (which turns them on and needs TLS files), whose `X-Frame-Options: DENY` breaks the Element Call Cinny frames from its own origin. `SERVER_HOST` must not be a loopback address: probes and Service reach the pod IP.
extraEnv: []

podDisruptionBudget:
  # -- Create a PodDisruptionBudget (`unhealthyPodEvictionPolicy: AlwaysAllow`).
  enabled: false
  # @schema
  # anyOf:
  #   - type: integer
  #     minimum: 0
  #   - type: string
  #     pattern: "^[0-9]+%$"
  # @schema
  # -- Pods that may be unavailable at once (a number or a percentage).
  maxUnavailable: 1

autoscaling:
  # -- Create a HorizontalPodAutoscaler. Enabling it drops `replicas` from the Deployment: it falls to 1 until the HPA reacts.
  enabled: false
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- HPA minimum replicas.
  minReplicas: 2
  # @schema
  # type: integer
  # minimum: 1
  # @schema
  # -- HPA maximum replicas.
  maxReplicas: 10
  # @schema
  # type: array
  # items:
  #   type: object
  # @schema
  # -- Raw `autoscaling/v2` MetricSpec list. CPU `Utilization` is a percentage of `resources.requests.cpu`: with the 10m floor, 75% fires at ~8m, so size requests first.
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 75
          type: Utilization
      type: Resource
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- HPA behavior. Slow scale-down: traffic of a web client comes in bursts (page loads).
  behavior:
    # @schema
    # type: object
    # additionalProperties: true
    # @schema
    scaleDown:
      stabilizationWindowSeconds: 300

verticalPodAutoscaler:
  # -- Create a VerticalPodAutoscaler (needs the VPA CRDs, see the `vertical-pod-autoscaler-crds` chart).
  enabled: false
  # @schema
  # type: string
  # enum: ["Off", Initial, Recreate, InPlaceOrRecreate]
  # @schema
  # -- VPA update mode. Not combinable with an HPA acting on the same resource.
  updateMode: "Off"
  # @schema
  # type: string
  # @schema
  # -- Recommender name (`spec.recommenders`, which takes at most one). Empty: the recommender named `default`. Set it when the cluster's recommender runs under another `--recommender-name`: a VPA nobody serves gets no recommendation.
  recommender: ""
  # @schema
  # type: array
  # items:
  #   type: string
  #   enum: [cpu, memory]
  # @schema
  # -- Resources VPA controls.
  controlledResources:
    - cpu
    - memory
  # @schema
  # type: string
  # enum: [RequestsAndLimits, RequestsOnly]
  # @schema
  # -- Whether VPA also scales limits.
  controlledValues: RequestsAndLimits
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Lower bound of recommendations (for example `{cpu: 10m, memory: 16Mi}`).
  minAllowed: {}
  # @schema
  # type: object
  # additionalProperties: true
  # @schema
  # -- Upper bound of recommendations.
  maxAllowed: {}

metrics:
  # -- Serve Prometheus metrics on `/metrics` (`SERVER_METRICS`). Same port as the app and unauthenticated: an Ingress or HTTPRoute publishes them too, unless your proxy blocks the path.
  enabled: false
  serviceMonitor:
    # -- Create a Prometheus Operator ServiceMonitor (scrapes the app Service). Needs `metrics.enabled`; exclusive with `podMonitor`.
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Extra labels (for example `release: kube-prometheus-stack`).
    labels: {}
    # -- Scrape interval (empty: Prometheus default).
    interval: ""
    # -- Scrape timeout (empty: Prometheus default).
    scrapeTimeout: ""
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Relabelings.
    relabelings: []
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Metric relabelings.
    metricRelabelings: []
  podMonitor:
    # -- Create a Prometheus Operator PodMonitor. Needs `metrics.enabled`; exclusive with `serviceMonitor`.
    enabled: false
    # @schema
    # type: object
    # additionalProperties:
    #   type: string
    # @schema
    # -- Extra labels.
    labels: {}
    # -- Scrape interval (empty: Prometheus default).
    interval: ""
    # -- Scrape timeout (empty: Prometheus default).
    scrapeTimeout: ""
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Relabelings.
    relabelings: []
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Metric relabelings.
    metricRelabelings: []

networkPolicy:
  # -- Create a NetworkPolicy (ingress: the HTTP port).
  enabled: true
  http:
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- NetworkPolicyPeer list allowed to reach the HTTP port (your ingress controller or Gateway, and Prometheus with `metrics.enabled`). Empty: any source.
    from: []
  egress:
    # -- Restrict egress to `extraEgress`. The server opens no connection and resolves no name, so an empty list (deny all) is enough.
    enabled: false
    # @schema
    # type: array
    # items:
    #   type: object
    # @schema
    # -- Extra `NetworkPolicyEgressRule`s.
    extraEgress: []
