apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  annotations:
    ignore-check.kube-linter.io/hpa-minimum-three-replicas: "Cinny is a stateless static server: two replicas keep a rolling update gap-free."
  labels:
    app.kubernetes.io/instance: cinny
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: web
    app.kubernetes.io/version: "0.0.0"
    helm.sh/chart: cinny-0.0.0
  name: cinny-web
  namespace: cinny
spec:
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
  maxReplicas: 10
  metrics:
    - resource:
        name: cpu
        target:
          averageUtilization: 75
          type: Utilization
      type: Resource
  minReplicas: 2
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cinny-web
