{
"apiVersion": "apiextensions.k8s.io/v1",
"kind": "CustomResourceDefinition",
"metadata": {
"annotations": {
{{- with include "agent-substrate-crds.crdAnnotations" . | trimPrefix "{" | trimSuffix "}" }}{{ . }},{{- end }}
"controller-gen.kubebuilder.io/version": "v0.20.1"
},
"name": "sandboxconfigs.ate.dev",
"labels": {
{{ include "agent-substrate-crds.crdLabels" . | trimPrefix "{" | trimSuffix "}" }}
}
},
"spec": {
"group": "ate.dev",
"names": {
"kind": "SandboxConfig",
"listKind": "SandboxConfigList",
"plural": "sandboxconfigs",
"shortNames": [
"sandboxconfig"
],
"singular": "sandboxconfig"
},
"scope": "Cluster",
"versions": [
{
"additionalPrinterColumns": [
{
"jsonPath": ".spec.sandboxClass",
"name": "Class",
"type": "string"
},
{
"jsonPath": ".spec.defaultVersion",
"name": "Default",
"type": "string"
},
{
"jsonPath": ".metadata.creationTimestamp",
"name": "Age",
"type": "date"
}
],
"name": "v1alpha1",
"schema": {
"openAPIV3Schema": {
"description": "SandboxConfig is cluster-scoped configuration describing the versions of the\nsandbox binaries for a sandbox runtime family. It is referenced by an\nActorTemplate's sandbox_config.config_name (required) and decouples sandbox\nbinary selection from the workload definition.",
"properties": {
"apiVersion": {
"description": "APIVersion defines the versioned schema of this representation of an object.\nServers should convert recognized schemas to the latest internal value, and\nmay reject unrecognized values.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources",
"type": "string"
},
"kind": {
"description": "Kind is a string value representing the REST resource this object represents.\nServers may infer this from the endpoint the client submits requests to.\nCannot be updated.\nIn CamelCase.\nMore info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds",
"type": "string"
},
"metadata": {
"type": "object"
},
"spec": {
"description": "spec defines the desired state of SandboxConfig",
"properties": {
"defaultVersion": {
"description": "defaultVersion names the entry in versions that new sandboxes boot with.\nIt must name an existing, non-Disabled version.",
"maxLength": 63,
"minLength": 1,
"type": "string"
},
"sandboxClass": {
"default": "gvisor",
"description": "SandboxClass is the sandbox runtime family this config applies to. An\nActorTemplate only uses SandboxConfigs whose SandboxClass matches its\nsandbox_config.sandbox_class.",
"enum": [
"gvisor",
"microvm"
],
"type": "string"
},
"versions": {
"description": "versions are the sandbox versions this config offers, keyed by name.",
"items": {
"description": "SandboxVersionConfig is one version of a SandboxConfig: the exact pause image\nand asset set a sandbox boots with.",
"properties": {
"assets": {
"additionalProperties": {
"additionalProperties": {
"description": "AssetFile is one content-addressed file that atelet fetches for a sandbox\nruntime (e.g. the gVisor runsc binary, or a micro-VM kernel/firmware/config).",
"properties": {
"sha256": {
"description": "SHA256 is the lower-case hex SHA256 of the asset. It both names the cached\nfile (preventing collisions) and verifies the download's integrity.",
"pattern": "^[a-f0-9]{64}$",
"type": "string"
},
"url": {
"description": "URL is where to download the asset from (e.g. a gs:// URL). atelet\nfetches every URL through the node's object-store plugin, with the\nplugin's credentials. The plugin refuses URLs under a snapshot location.\nThe in-tree plugin serves only its storage backend's scheme: gs:// on\nGCS, s3:// on S3. A gs:// URL the plugin has no object for or cannot\nserve is then read anonymously, which serves public buckets such as\ngs://gvisor.",
"maxLength": 2048,
"minLength": 1,
"type": "string"
}
},
"required": [
"sha256",
"url"
],
"type": "object"
},
"type": "object"
},
"description": "Assets is the set of files atelet fetches for this runtime, keyed first by\narchitecture (GOARCH, e.g. \"amd64\", \"arm64\") and then by asset name. The\nasset names are interpreted by the sandbox backend: gVisor expects a\n\"gvisor\" asset (the release's gvisor.tar.zstd, which atelet extracts so\nthe gvisor-bin/ helpers sit next to runsc; a legacy bare-binary \"runsc\"\nasset is still accepted); a micro-VM backend expects several (e.g.\n\"cloud-hypervisor\", \"kata-kernel\", \"kata-image\"). The schema is\nintentionally generic; per-class requirements are enforced by a\nValidatingAdmissionPolicy.",
"type": "object"
},
"name": {
"description": "name identifies this version within its SandboxConfig. It is a DNS label\n(lower-case alphanumerics and '-').",
"maxLength": 63,
"minLength": 1,
"pattern": "^[a-z0-9]([-a-z0-9]*[a-z0-9])?$",
"type": "string"
},
"pauseImage": {
"description": "PauseImage is the container image used as the root sandbox container.\nIt holds the sandbox's namespaces and runs no workload code, so it is an\nimplementation detail of the sandbox rather than something actor authors\nchoose. Required for gvisor; not allowed for microvm, which runs no pause\ncontainer. It is captured in the snapshot manifest alongside the sandbox\nbinaries, so a restore always re-creates the sandbox from the same image\nthe snapshot was taken with.\n\nTypically, set it to [1] for on-gcp, and [2] for off-gcp\n\n  - [1] gcr.io/gke-release/pause@sha256:bcbd57ba5653580ec647b16d8163cdd1112df3609129b01f912a8032e48265da\n  - [2] registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4",
"maxLength": 512,
"minLength": 1,
"type": "string",
"x-kubernetes-validations": [
{
"message": "All images must include a digest",
"rule": "self.contains('@')"
}
]
},
"state": {
"default": "Enabled",
"description": "state is whether this version may be used: Enabled (default) or\nDisabled.",
"enum": [
"Enabled",
"Disabled"
],
"type": "string"
}
},
"required": [
"name"
],
"type": "object"
},
"maxItems": 16,
"minItems": 1,
"type": "array",
"x-kubernetes-list-map-keys": [
"name"
],
"x-kubernetes-list-type": "map"
}
},
"required": [
"defaultVersion",
"sandboxClass",
"versions"
],
"type": "object",
"x-kubernetes-validations": [
{
"message": "defaultVersion must name an entry in versions",
"rule": "self.versions.exists(v, v.name == self.defaultVersion)"
},
{
"message": "the version named by defaultVersion must not be Disabled",
"rule": "!self.versions.exists(v, v.name == self.defaultVersion && has(v.state) && v.state == 'Disabled')"
},
{
"message": "pauseImage is required on every version for gvisor and not allowed for other sandbox classes",
"rule": "self.sandboxClass == 'gvisor' ? self.versions.all(v, has(v.pauseImage) && size(v.pauseImage) > 0) : self.versions.all(v, !has(v.pauseImage) || size(v.pauseImage) == 0)"
}
]
}
},
"required": [
"spec"
],
"type": "object"
}
},
"served": true,
"storage": true,
"subresources": {}
}
]
}
}
